# Kind cluster: management – chạy Argo CD (quản lý dev + prod)
# API server expose ra host port 33443.
# Sau `kind create`: kubectl config set-cluster kind-management --server=https://127.0.0.1:33443
# rồi mới helm install cilium (doc mục 1.2) — tránh TLS 0.0.0.0; disableDefaultCNI bắt buộc Cilium trước Argo CD.
# Dùng node image + containerd patch tương thích cgroup v2 (Ubuntu 22.04+).
# Pod/Service CIDR riêng (bước 1 chuẩn bị Cilium ClusterMesh — không trùng các cụm khác).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # Không dùng kindnet: Cilium là CNI duy nhất (bắt buộc cài Cilium ngay sau khi tạo cụm — mục 1.2).
  disableDefaultCNI: true
  podSubnet: 10.200.0.0/16
  serviceSubnet: 10.220.0.0/16

containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
      SystemdCgroup = true

nodes:
  - role: control-plane
    image: kindest/node:v1.28.0
    extraPortMappings:
      - containerPort: 6443
        hostPort: 33443
        protocol: TCP
