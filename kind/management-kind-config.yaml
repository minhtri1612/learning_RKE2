# Kind cluster: management – chạy Argo CD (quản lý dev + prod)
# API server expose ra host port 33443.
# Dùng node image + containerd patch tương thích cgroup v2 (Ubuntu 22.04+).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
      SystemdCgroup = true

nodes:
  - role: control-plane
    image: kindest/node:v1.28.0
    extraPortMappings:
      - containerPort: 6443
        hostPort: 33443
        protocol: TCP
