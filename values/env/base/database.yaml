# Shared database baseline managed by DevOps.
namespace: database
workload:
  kind: statefulset
  image:
    repository: postgres
initContainer:
  enabled: false
migration:
  enabled: false
autoscaling:
  enabled: false
ingress:
  enabled: false
service:
  type: ClusterIP
  port: 5432
  targetPort: 5432
statefulset:
  containerPort: 5432
  portName: postgres
  volumeName: postgres-storage
  mountPath: /var/lib/postgresql/data
  subPath: pgdata
  pgdataPath: /var/lib/postgresql/data/pgdata
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1
replicas: 1
persistence:
  useEBS: false
auth:
  username: meo_admin
  database: meo_stationery
