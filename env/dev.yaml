# Tag/replica + env (suffix secret). useExternalSecrets mặc định true trong template/values.yaml.
# helm ... -f app/be.yaml|db.yaml -f env/dev.yaml

env: dev

backend:
  image:
    tag: "4.0.2"
  replicaCount: 5
  rollout:
    enabled: true
    strategy: canary

database:
  image:
    tag: "16"
  replicaCount: 3

# Cùng image repo với backend (app/be.yaml); tag phải tồn tại trên registry — 1.0.0 thường gây ErrImagePull
