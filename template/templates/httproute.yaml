{{- if and .Values.httpRoute.enabled (eq (.Values.currentService | default "backend") "backend") (ne (.Values.workloadKind | default "deployment") "statefulset") -}}
{{- $fullName := include "template.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $stableSvc := .Values.rollout.canary.stableService | default (printf "%s-stable" $fullName) -}}
{{- $canarySvc := .Values.rollout.canary.canaryService | default (printf "%s-canary" $fullName) -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "template.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .filters }}
      filters:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      {{- if and $.Values.rollout.enabled ($.Values.httpRoute.useRolloutCanaryBackends | default true) }}
      backendRefs:
        - name: {{ $stableSvc }}
          port: {{ $svcPort }}
          weight: {{ $.Values.httpRoute.stableWeight | default 90 }}
        - name: {{ $canarySvc }}
          port: {{ $svcPort }}
          weight: {{ $.Values.httpRoute.canaryWeight | default 10 }}
      {{- else }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}
          weight: 1
      {{- end }}
    {{- end }}
{{- end }}
