{{- if and .Values.httpRoute.enabled (eq (.Values.currentService | default "backend") "backend") (ne (.Values.workloadKind | default "deployment") "statefulset") -}}
{{- $fullName := include "template.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $svcName := .Values.currentService | default "backend" -}}
{{- $svc := (index .Values $svcName) | default dict -}}
{{- $rolloutCfg := deepCopy (.Values.rollout | default dict) -}}
{{- if hasKey $svc "rollout" -}}
{{- $rolloutCfg = mergeOverwrite $rolloutCfg ($svc.rollout | default dict) -}}
{{- end -}}
{{- $rolloutEnabled := $rolloutCfg.enabled | default false -}}
{{- $strategy := $rolloutCfg.strategy | default "canary" | lower -}}
{{- $stableSvc := $rolloutCfg.canary.stableService | default (printf "%s-stable" $fullName) -}}
{{- $canarySvc := $rolloutCfg.canary.canaryService | default (printf "%s-canary" $fullName) -}}
{{- $activeSvc := $rolloutCfg.blueGreen.activeService | default $fullName -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "template.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    {{- $routeTo := .routeTo | default "" | lower }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .filters }}
      filters:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      {{- if and $rolloutEnabled (eq $strategy "canary") (eq $routeTo "canary") }}
      backendRefs:
        - name: {{ $canarySvc }}
          port: {{ $svcPort }}
          weight: 1
      {{- else if and $rolloutEnabled (eq $strategy "canary") (eq $routeTo "stable") }}
      backendRefs:
        - name: {{ $stableSvc }}
          port: {{ $svcPort }}
          weight: 1
      {{- else if and $rolloutEnabled (eq $strategy "bluegreen") (eq $routeTo "preview") }}
      backendRefs:
        - name: {{ $rolloutCfg.blueGreen.previewService | default (printf "%s-preview" $fullName) }}
          port: {{ $svcPort }}
          weight: 1
      {{- else if and $rolloutEnabled ($.Values.httpRoute.useRolloutCanaryBackends | default true) (eq $strategy "canary") }}
      backendRefs:
        - name: {{ $stableSvc }}
          port: {{ $svcPort }}
          weight: {{ $.Values.httpRoute.stableWeight | default 90 }}
        - name: {{ $canarySvc }}
          port: {{ $svcPort }}
          weight: {{ $.Values.httpRoute.canaryWeight | default 10 }}
      {{- else if and $rolloutEnabled (eq $strategy "bluegreen") }}
      backendRefs:
        - name: {{ $activeSvc }}
          port: {{ $svcPort }}
          weight: 1
      {{- else }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}
          weight: 1
      {{- end }}
    {{- end }}
{{- end }}
