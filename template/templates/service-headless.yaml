{{- if eq (.Values.workloadKind | default "deployment") "statefulset" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "template.fullname" . }}-hl
  labels:
    {{- include "template.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort | default (.Values.service.portName | default "http") }}
      protocol: TCP
      name: {{ .Values.service.portName | default "http" }}
  selector:
    {{- include "template.selectorLabels" . | nindent 4 }}
{{- end }}
