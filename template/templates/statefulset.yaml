{{- if eq (.Values.workloadKind | default "deployment") "statefulset" }}
{{- $p := .Values.persistence | default dict }}
{{- $st := .Values.statefulset | default dict }}
{{- $svcName := .Values.currentService | default "database" }}
{{- $svc := (index .Values $svcName) | default dict }}
{{- $svcSt := (index $svc "statefulset") | default dict }}
{{- $lProbe := (index $svcSt "livenessProbe") | default (index $st "livenessProbe") }}
{{- $rProbe := (index $svcSt "readinessProbe") | default (index $st "readinessProbe") }}
{{- $mountPath := (index $svcSt "mountPath") | default (index $st "mountPath") | default "/var/lib/postgresql/data" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "template.fullname" . }}
  labels:
    {{- include "template.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "template.fullname" . }}-hl
  replicas: {{ $svc.replicaCount | default .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "template.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "template.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "template.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ include "template.imageRepositoryCurrent" . }}:{{ include "template.imageTagDatabase" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ .Values.service.portName | default "http" }}
              containerPort: {{ .Values.service.containerPort | default .Values.service.port }}
              protocol: TCP
          {{- if or (and (eq $svcName "database") .Values.database) .Values.extraEnv }}
          env:
            {{- if and (eq $svcName "database") .Values.database }}
            - name: POSTGRES_USER
              value: {{ .Values.database.username | default "postgres" | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.name | default "postgres" | quote }}
            {{- if .Values.database.password }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.database.password | quote }}
            {{- else if .Values.database.existingSecret }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.key | default "password" }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with $lProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $rProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ $mountPath }}
              {{- with $st.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.runtimeConfig.enabled }}
            - name: app-config
              mountPath: {{ .Values.runtimeConfig.mountPath | default "/app/config" }}
              readOnly: true
            {{- end }}
      {{- if or (not ($p.enabled | default true)) .Values.runtimeConfig.enabled }}
      volumes:
        {{- if not ($p.enabled | default true) }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.runtimeConfig.enabled }}
        - name: app-config
          configMap:
            name: {{ include "template.fullname" . }}-config
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if ($p.enabled | default true) }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with $p.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $p.size | default "10Gi" | quote }}
  {{- end }}
{{- end }}
