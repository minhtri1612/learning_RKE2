{{- $fullName := include "template.fullname" . }}
{{- $selectors := include "template.selectorLabels" . }}
{{- if ne (.Values.workloadKind | default "deployment") "statefulset" }}
{{- $stableName := .Values.rollout.canary.stableService | default (printf "%s-stable" $fullName) }}
{{- $canaryName := .Values.rollout.canary.canaryService | default (printf "%s-canary" $fullName) }}
{{- range $svcName := list $stableName $canaryName }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "template.labels" $ | nindent 4 }}
  {{- with $.Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: {{ $.Values.service.targetPort | default ($.Values.service.portName | default "http") }}
      protocol: TCP
      name: {{ $.Values.service.portName | default "http" }}
  selector:
    {{- $selectors | nindent 4 }}
---
{{- end }}
{{- else }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "template.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort | default (.Values.service.portName | default "http") }}
      protocol: TCP
      name: {{ .Values.service.portName | default "http" }}
  selector:
    {{- $selectors | nindent 4 }}
{{- end }}
