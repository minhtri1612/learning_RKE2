{{- if and .Values.gatewayAPI.enabled .Values.gatewayAPI.createGateway .Values.gatewayAPI.nodePortService.enabled (eq (.Values.currentService | default "backend") "backend") (ne (.Values.workloadKind | default "deployment") "statefulset") }}
---
# NodePort Service để expose Cilium Envoy Proxy ra ngoài cluster.
# Dùng trong kiến trúc Path 2: AWS NLB (Terraform) → NodePort trên EC2 Node → Envoy Proxy.
# Cilium tạo Service "cilium-gateway-<gatewayName>" kiểu LoadBalancer (pending trên Cloud
# không có CCM), ta dùng Service này làm điểm vào từ NLB thay thế.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gatewayAPI.gatewayName | default "meo-gw" }}-nodeport
  namespace: {{ .Values.gatewayAPI.gatewayNamespace | default .Release.Namespace }}
  labels:
    {{- include "template.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-nodeport
spec:
  type: NodePort
  selector:
    # Cilium gán label này cho các Envoy pod của Gateway
    io.cilium/gateway: {{ .Values.gatewayAPI.gatewayName | default "meo-gw" }}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: {{ .Values.gatewayAPI.listener.port | default 80 }}
      nodePort: {{ .Values.gatewayAPI.nodePortService.httpNodePort | default 32080 }}
    {{- if .Values.gatewayAPI.httpsListener.enabled }}
    - name: https
      protocol: TCP
      port: 443
      targetPort: {{ .Values.gatewayAPI.httpsListener.port | default 443 }}
      nodePort: {{ .Values.gatewayAPI.nodePortService.httpsNodePort | default 32443 }}
    {{- end }}
{{- end }}
