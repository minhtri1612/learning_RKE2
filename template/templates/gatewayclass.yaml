{{- if and .Values.gatewayAPI.enabled .Values.gatewayAPI.createGatewayClass (eq (.Values.currentService | default "backend") "backend") }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayAPI.gatewayClassName | default "cilium" }}
  labels:
    {{- include "template.labels" . | nindent 4 }}
spec:
  controllerName: {{ .Values.gatewayAPI.gatewayClassControllerName | default "io.cilium/gateway-controller" }}
{{- end }}
