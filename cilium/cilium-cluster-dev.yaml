# Overlay Argo: cilium-dev (cluster mesh spoke)
cluster:
  name: dev
  id: 2

# Hubble UI: NodePort cố định — http://<node-private-ip>:31201 (VPN / bastion).
hubble:
  ui:
    enabled: true
    service:
      type: NodePort
      nodePort: 31201

clustermesh:
  config:
    enabled: true
  apiserver:
    service:
      type: NodePort
      nodePort: 32379
