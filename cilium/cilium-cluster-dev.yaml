# Overlay Argo: cilium-dev (cluster mesh spoke)
# RKE2 disable-kube-proxy: Cilium cần IP apiserver thật của **cluster dev** (configure.py patch).
k8sServiceHost: "10.1.101.94"
k8sServicePort: 6443

cluster:
  name: dev
  id: 2

# Hubble UI: NodePort cố định — http://<node-private-ip>:31201 (VPN / bastion).
hubble:
  ui:
    enabled: true
    service:
      type: NodePort
      nodePort: 31201

clustermesh:
  config:
    enabled: true
  apiserver:
    service:
      type: NodePort
      nodePort: 32379
