# Helm Cilium **lần đầu** trên management (trước kube-prometheus-stack).
# Dùng cùng lúc với cilium-values-management.yaml:
#   helm upgrade --install cilium ... -f .../cilium-values-management.yaml -f .../cilium-values-management-bootstrap.yaml
#
# Override khi bootstrap:
# 1) ServiceMonitor — tắt (chưa có Prometheus Operator).
# 2) clustermesh.apiserver.service NodePort (khớp AWS; Helm --wait không chờ external LB pending).
#
# Git: cilium-values-management.yaml đã NodePort 32379 (RKE2/AWS).

hubble:
  metrics:
    serviceMonitor:
      enabled: false

prometheus:
  serviceMonitor:
    enabled: false

operator:
  prometheus:
    serviceMonitor:
      enabled: false

clustermesh:
  apiserver:
    service:
      type: NodePort
