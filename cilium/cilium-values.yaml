kubeProxyReplacement: true
# k8sServiceHost/Port: **không** đặt ở file chung (dev/prod khác IP master) — xem cilium-cluster-dev.yaml,
# cilium-cluster-prod.yaml; management: cilium-values-management.yaml. configure.py patch PLACEHOLDER_MASTER_PRIVATE_IP.

# Pod CIDR must NOT overlap with any VPC CIDR (10.0.0.0/16, 10.1.0.0/16, 10.2.0.0/16).
# Default cluster-pool uses 10.0.0.0/8, which causes Cilium to install /24 routes (e.g.
# 10.0.1.0/24 via cilium_vxlan) that shadow VPC peering routes (10.0.0.0/16 via ens5),
# breaking reply packets to the OpenVPN server (10.0.1.152) → API/SSH timeout on all nodes.
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: ["172.16.0.0/12"]
    clusterPoolIPv4MaskSize: 24

# Spoke (dev/prod): bật clustermesh-apiserver để management có endpoint remote thật
# (NodePort trên mỗi spoke) trong mô hình GitOps declarative.
clustermesh:
  useAPIServer: true
  apiserver:
    replicas: 1

gatewayAPI:
  enabled: true
  # App chart (template/) owns GatewayClass; avoid duplicate + operator reconcile issues.
  gatewayClass:
    create: "false"

# L7 qua Envoy: cần cho HTTP/DNS chi tiết trên flow khi traffic đi qua proxy L7 (Gateway/L7 policy).
l7Proxy: true

loadBalancer:
  algorithm: maglev

# Phải khớp hub (cilium-values-management.yaml): ClusterMesh không ổn định khi hub tắt encryption mà spoke bật WireGuard.
encryption:
  enabled: false

# BPF events → monitor/Hubble (drop / policy verdict / trace). Bật rõ ràng để debug policy trên UI.
bpf:
  events:
    drop:
      enabled: true
    policyVerdict:
      enabled: true
    trace:
      enabled: true

# Hubble UI: Service map + flow table. Không thể bật “policy simulation” hay dashboard SRE (latency/5xx)
# trong chính Hubble UI — các phần đó là cilium policy trace / Grafana + Prometheus.
hubble:
  enabled: true
  # Buffer flow gần đây (giá trị hợp lệ theo chart Cilium).
  eventBufferCapacity: "16383"
  # Gắn flow với CiliumNetworkPolicy (egress_allowed_by / ingress_denied_by) trong UI.
  networkPolicyCorrelation:
    enabled: true
  # false = giữ tối đa chi tiết L7 trên UI; bật redact khi cần ẩn PII.
  redact:
    enabled: false
  # Một phần event từ cgroup lạ; false = hiển thị thêm (có thể nhiễu).
  skipUnknownCGroupIDs: false
  relay:
    enabled: true
  # UI workload: bật + NodePort riêng trong cilium-cluster-{dev,prod}.yaml (31201/31203).
  # Management: cilium-values-management.yaml (UI ClusterIP / port-forward 12000).
  ui:
    enabled: false
  metrics:
    # https://docs.cilium.io/en/stable/observability/metrics/#hubble-metrics
    enabled:
      - dns:query
      - drop
      - tcp
      - flow
      - icmp
      - http
      - port-distribution
    enableOpenMetrics: true
    serviceMonitor:
      # Disabled: Cilium is installed BEFORE kube-prometheus-stack (ServiceMonitor CRD doesn't
      # exist yet). Enable after monitoring stack is deployed:
      #   helm upgrade cilium cilium/cilium -n kube-system --reuse-values \
      #     --set hubble.metrics.serviceMonitor.enabled=true \
      #     --set prometheus.serviceMonitor.enabled=true \
      #     --set operator.prometheus.serviceMonitor.enabled=true \
      #     --set prometheus.serviceMonitor.trustCRDsExist=true
      enabled: false
    # Dashboard JSON Grafana: ConfigMap tạo trên cluster có Cilium (workload). Grafana của bạn
    # chạy trên management → không tự import; bật true nếu sau này có Grafana trên cùng cluster.
    dashboards:
      enabled: false

prometheus:
  enabled: true
  serviceMonitor:
    # Disabled until kube-prometheus-stack is installed (see hubble.metrics.serviceMonitor note).
    enabled: false

operator:
  # Single-node / nhỏ: chart mặc định 2 replica + hostPort dễ Pending — giữ 1.
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      # Disabled until kube-prometheus-stack is installed (see hubble.metrics.serviceMonitor note).
      enabled: false
