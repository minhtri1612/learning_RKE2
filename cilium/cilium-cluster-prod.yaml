# Overlay Argo: cilium-prod (cluster mesh spoke)
# RKE2 disable-kube-proxy: Cilium cần IP apiserver thật của **cluster prod** (configure.py patch).
k8sServiceHost: "10.2.101.132"
k8sServicePort: 6443

cluster:
  name: prod
  id: 4

# Hubble UI: NodePort — http://<node-private-ip>:31203 (VPN / bastion).
hubble:
  ui:
    enabled: true
    service:
      type: NodePort
      nodePort: 31203

clustermesh:
  config:
    enabled: true
  apiserver:
    service:
      type: NodePort
      nodePort: 32380
