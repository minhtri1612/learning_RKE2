# Overlay Argo: cilium-prod (cluster mesh spoke)
cluster:
  name: prod
  id: 4

# Hubble UI: NodePort — http://<node-private-ip>:31203 (VPN / bastion).
hubble:
  ui:
    enabled: true
    service:
      type: NodePort
      nodePort: 31203

clustermesh:
  config:
    enabled: true
  apiserver:
    service:
      type: NodePort
      nodePort: 32380
