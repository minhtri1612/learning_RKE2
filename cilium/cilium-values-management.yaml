# Cilium trên cluster **management** (hub ClusterMesh + Hubble UI). GitOps / Argo: app `cilium-management`.
# cluster.id/name: management / 1. Spoke: cilium-cluster-*.yaml (id 2–4) + clustermesh-management-peer.yaml.
# Helm **tay** lần đầu (trước Prometheus Operator): thêm `-f cilium-values-management-bootstrap.yaml` để tắt ServiceMonitor.

cluster:
  name: management
  id: 1

kubeProxyReplacement: true

gatewayAPI:
  enabled: false
  gatewayClass:
    create: "false"

l7Proxy: false

loadBalancer:
  algorithm: maglev

encryption:
  enabled: false

clustermesh:
  useAPIServer: true
  config:
    enabled: true
    # Phải khớp cluster.name trên spoke (dev / staging / prod). Tạo key trong Secret
    # cilium-clustermesh (+ cilium-kvstoremesh) trên hub — không có thì `cilium clustermesh status`
    # luôn báo "No cluster connected" dù agent spoke đã nối etcd (CLI đọc secret để biết tên peer).
    # cilium-clustermesh (agent hub): với KVStoreMesh chart dùng endpoint local apiserver.
    # cilium-kvstoremesh: template vẫn cần address+port từng tên cluster — trỏ nội bộ tới Service
    # clustermesh-apiserver (cùng cluster), không phải IP từng Kind spoke.
    clusters:
      dev:
        address: clustermesh-apiserver.kube-system.svc
        port: 2379
      staging:
        address: clustermesh-apiserver.kube-system.svc
        port: 2379
      prod:
        address: clustermesh-apiserver.kube-system.svc
        port: 2379

bpf:
  events:
    drop:
      enabled: true
    policyVerdict:
      enabled: true
    trace:
      enabled: true

hubble:
  enabled: true
  eventBufferCapacity: "16383"
  networkPolicyCorrelation:
    enabled: true
  redact:
    enabled: false
  skipUnknownCGroupIDs: false
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns:query
      - drop
      - tcp
      - flow
      - icmp
      - http
      - port-distribution
    enableOpenMetrics: true
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: false

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true

operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
