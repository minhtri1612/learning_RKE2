# Cilium trên cluster **management** (hub ClusterMesh + Hubble UI). GitOps / Argo: app `cilium-management`.
# cluster.id/name: management / 1. Spoke: cilium-cluster-*.yaml (id 2–3) + clustermesh-management-peer.yaml.
# Helm **tay** lần đầu (trước Prometheus Operator): thêm `-f cilium-values-management-bootstrap.yaml` để tắt ServiceMonitor.

cluster:
  name: management
  id: 1

kubeProxyReplacement: true
k8sServiceHost: "PLACEHOLDER_MASTER_PRIVATE_IP"
k8sServicePort: 6443

gatewayAPI:
  enabled: false
  gatewayClass:
    create: "false"

l7Proxy: false

loadBalancer:
  algorithm: maglev

encryption:
  enabled: false

clustermesh:
  useAPIServer: true
  # Lab 1 node: giữ replicas=1 (chart mặc định 2 có thể khiến pod 2 Pending trên single-node).
  apiserver:
    replicas: 1
    # AWS / RKE2: NodePort. Spoke trỏ hub qua private IP + cổng này (clustermesh-management-peer.yaml).
    service:
      type: NodePort
      nodePort: 32379
      annotations: {}
  config:
    enabled: true
    # Phải khớp cluster.name trên spoke (dev / prod). Tạo key trong Secret
    # cilium-clustermesh (+ cilium-kvstoremesh) trên hub — không có thì `cilium clustermesh status`
    # luôn báo "No cluster connected" dù agent spoke đã nối etcd (CLI đọc secret để biết tên peer).
    # GitOps ClusterMesh: management phải trỏ tới endpoint clustermesh-apiserver thực của spoke.
    # Trên Cloud (AWS): thay bằng Private IP của NLB/instance thật, không dùng Docker IP.
    clusters:
      - name: dev
        ips:
          - PLACEHOLDER_DEV_NODE_IP
        port: 32379
      - name: prod
        ips:
          - PLACEHOLDER_PROD_NODE_IP
        port: 32380

bpf:
  events:
    drop:
      enabled: true
    policyVerdict:
      enabled: true
    trace:
      enabled: true

hubble:
  enabled: true
  eventBufferCapacity: "16383"
  networkPolicyCorrelation:
    enabled: true
  redact:
    enabled: false
  skipUnknownCGroupIDs: false
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns:query
      - drop
      - tcp
      - flow
      - icmp
      - http
      - port-distribution
    enableOpenMetrics: true
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: false

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true

operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
