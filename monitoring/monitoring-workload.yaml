# Workload clusters: Prometheus Agent (scrape in-cluster) + remote_write tới Prometheus management.
# Management: prometheus.prometheusSpec.enableRemoteWriteReceiver + Service NodePort 32090 (monitoring-mgmt.yaml).
#
# remoteWrite URL — không hardcode IP lâu dài trong Git. Cập nhật bằng:
#   ./scripts/sync-monitoring-remote-write-url.sh
# (đọc terraform output management: worker_private_ips / master_private_ip) hoặc:
#   MGMT_PROMETHEUS_REMOTE_WRITE_URL='http://<mgmt-private-ip>:32090/api/v1/write' ./scripts/sync-monitoring-remote-write-url.sh
#
# Cần route từ VPC workload tới VPC management (peering) và SG mở TCP 32090 tới node management.
# Kiểm tra từ máy có VPN:
#   ./scripts/sync-monitoring-remote-write-url.sh --check
#   curl -sS -o /dev/null -w "%{http_code}\n" "$(./scripts/sync-monitoring-remote-write-url.sh --print-ready-url)"
#
# Phân tách env trong Grafana: dùng label từ monitoring-workload-labels-{dev,prod}.yaml
#   ví dụ: up{cluster="dev"}, kube_pod_*{cluster="prod"}

fullnameOverride: kps-wl
grafana:
  enabled: false
prometheus:
  enabled: true
  agentMode: true
  prometheusSpec:
    retention: 1d
    storageSpec:
      emptyDir:
        medium: ""
    remoteWrite:
      # Chạy ./scripts/sync-monitoring-remote-write-url.sh trước khi commit/sync (default tạm: localhost — sai trên workload).
      - url: http://127.0.0.1:32090/api/v1/write
        name: management
        queueConfig:
          capacity: 10000
          maxShards: 50
          minShards: 1
          maxSamplesPerSend: 2000
          batchSendDeadline: 5s
          minBackoff: 30ms
          maxBackoff: 5s
alertmanager:
  enabled: false
prometheusOperator:
  enabled: true
prometheus-node-exporter:
  enabled: true
  service:
    type: ClusterIP
kube-state-metrics:
  enabled: true
  service:
    type: ClusterIP
# Disable system components (agent-only profile)
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
