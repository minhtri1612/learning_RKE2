# Source: generic-app/templates/migration-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: database-generic-app-migration
  namespace: database
  labels:
    helm.sh/chart: generic-app-0.1.0
    app.kubernetes.io/name: generic-app
    app.kubernetes.io/instance: database
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "5"
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 3
  template:
    metadata:
      name: database-generic-app-migration
      labels:
        app.kubernetes.io/name: generic-app
        app.kubernetes.io/instance: database
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z postgres.database.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']
      restartPolicy: Never
      containers:
        - name: db-migration
          image: "postgres:15-alpine"
          imagePullPolicy: Always
          resources:
            requests:
              ephemeral-storage: "500Mi"
            limits:
              ephemeral-storage: "1Gi"
          envFrom:
            - configMapRef:
                name: database-generic-app-configmap
            - secretRef:
                name: database-generic-app-secret
          command: ["/bin/sh", "-c"]
          args:
            - |
              set +e
              echo "=== Migration Job Started ==="

              DB_HOST=$(echo "$DATABASE_URL" | sed -n 's/.*@\([^:]*\):.*/\1/p')
              DB_PORT=$(echo "$DATABASE_URL" | sed -n 's/.*:\([0-9]*\)\/.*/\1/p')
              DB_PORT=${DB_PORT:-5432}

              MAX_RETRIES=30
              RETRY_COUNT=0
              while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                if command -v nc >/dev/null 2>&1; then
                  nc -z -w 2 "$DB_HOST" "$DB_PORT" 2>/dev/null && break
                else
                  timeout 2 bash -c "echo > /dev/tcp/$DB_HOST/$DB_PORT" 2>/dev/null && break
                fi
                RETRY_COUNT=$((RETRY_COUNT + 1))
                [ $((RETRY_COUNT % 5)) -eq 0 ] && echo "Waiting for DB... ($RETRY_COUNT/$MAX_RETRIES)"
                sleep 2
              done

              [ $RETRY_COUNT -ge $MAX_RETRIES ] && echo "ERROR: DB timeout" && exit 1
              sleep 3

              if [ -f "/app/node_modules/.bin/prisma" ]; then
                PRISMA_CMD="npx prisma"
              else
                PRISMA_CMD="npx prisma@6"
              fi

              set -e
              $PRISMA_CMD migrate deploy
              echo "Migration completed!"

              if [ ! -f /app/prisma/seed.ts ]; then
                echo "No seed.ts found, skipping."
                exit 0
              fi

              PRODUCT_COUNT=$(timeout 10 node -e "
                try {
                  const { PrismaClient } = require('@prisma/client');
                  const prisma = new PrismaClient();
                  prisma.product.count().then(n => { console.log(n); process.exit(0); })
                    .catch(() => process.exit(1));
                } catch(e) { console.log('0'); process.exit(0); }
              " 2>/dev/null | tr -d '\n' || echo "0")

              if [ "$PRODUCT_COUNT" -gt 0 ]; then
                echo "Already seeded ($PRODUCT_COUNT products). Skipping."
                exit 0
              fi

              if ! timeout 180 npx --yes tsx /app/prisma/seed.ts; then
                npm install -g tsx 2>/dev/null || true
                timeout 180 tsx /app/prisma/seed.ts
              fi

              echo "=== Migration & Seed completed ==="
