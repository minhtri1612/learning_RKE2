apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database-generic-app
  namespace: database
  labels:
    helm.sh/chart: generic-app-0.1.0
    app.kubernetes.io/name: generic-app
    app.kubernetes.io/instance: database
    app.kubernetes.io/version: "1.16.0"
