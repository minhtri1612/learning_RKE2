    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: database-generic-app
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-app
      app.kubernetes.io/instance: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-app
        app.kubernetes.io/instance: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: database
        image: "postgres:15-alpine"
        imagePullPolicy: Always
        ports:
