kind: PodDisruptionBudget
metadata:
  name: backend-generic-app-pdb
  namespace: meo-stationery
  labels:
    helm.sh/chart: generic-app-0.1.0
    app.kubernetes.io/name: generic-app
    app.kubernetes.io/instance: backend
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-app
      app.kubernetes.io/instance: backend
---
# Source: generic-app/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-generic-app-configmap
  namespace: meo-stationery
  labels:
    helm.sh/chart: generic-app-0.1.0
    app.kubernetes.io/name: generic-app
    app.kubernetes.io/instance: backend
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
data:
  NEXTAUTH_URL: "http://meo-stationery.local"
  NODE_ENV: "production"
---
# Source: generic-app/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: backend-generic-app
  namespace: meo-stationery
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app.kubernetes.io/name: generic-app
    app.kubernetes.io/instance: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
# Source: generic-app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-generic-app
  namespace: meo-stationery
  labels:
    helm.sh/chart: generic-app-0.1.0
    app.kubernetes.io/name: generic-app
    app.kubernetes.io/instance: backend
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-app
      app.kubernetes.io/instance: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-app
        app.kubernetes.io/instance: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - generic-app
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z dev-database-generic-app.database.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']
        resources:
          limits:
            cpu: 50m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
      containers:
      - name: 
        image: "minhtri1612/rke2:3.0.1"
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          failureThreshold: 30
          periodSeconds: 5
        envFrom:
        - configMapRef:
            name: backend-generic-app-configmap
        - secretRef:
            name: meo-stationery-backend-secrets-dev
        env: []
        resources:
          requests:
            memory: 256Mi
            cpu: 128m
          limits:
            memory: 2Gi
            cpu: 1000m
        ports:
        - containerPort: 3000
          name: http
---
# Source: generic-app/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-generic-app
  labels:
    helm.sh/chart: generic-app-0.1.0
    app.kubernetes.io/name: generic-app
    app.kubernetes.io/instance: backend
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  namespace: meo-stationery
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-generic-app
  minReplicas: 5
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
# Source: generic-app/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-generic-app
  namespace: meo-stationery
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: "meo-stationery-dev.local"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-generic-app
            port:
              number: 80
