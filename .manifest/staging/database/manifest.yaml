# Source: template/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: staging-database
  labels:
    helm.sh/chart: template-0.1.0
    app.kubernetes.io/name: database
    app.kubernetes.io/instance: staging-database
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: staging-database-hl
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: database
      app.kubernetes.io/instance: staging-database
  template:
    metadata:
      labels:
        helm.sh/chart: template-0.1.0
        app.kubernetes.io/name: database
        app.kubernetes.io/instance: staging-database
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: staging-database
      containers:
        - name: template
          image: "postgres:16"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: "meo_admin"
            - name: POSTGRES_DB
              value: "meo_stationery"
            - name: POSTGRES_PASSWORD
              value: "dev-only-change-me"
          livenessProbe:
            exec:
              command:
              - pg_isready
              - -U
              - meo_admin
              - -d
              - meo_stationery
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
              - pg_isready
              - -U
              - meo_admin
              - -d
              - meo_stationery
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "10Gi"
