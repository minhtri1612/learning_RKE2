name: Auto Render Manifests

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'env/**'
      - 'template/**'
      - 'argocd/manifest-apps/**'
      - '.github/workflows/render-manifests.yaml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cho phép bot commit ngược lại repo
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Render All Manifests
        run: |
          # Môi trường lấy từ env/*.yaml
          ENVS=$(ls env/*.yaml | xargs -n 1 basename | sed 's/.yaml//')

          for env in $ENVS; do
            echo "--- Rendering env: $env ---"
            rm -rf ".manifest/$env"
            mkdir -p ".manifest/$env"

            # Top-level keys trong env/<env>.yaml là tên service (backend, database, frontend, ...)
            SERVICES=$(awk '/^[a-zA-Z0-9_-]+:$/ {print substr($1,1,length($1)-1)}' "env/$env.yaml")

            for svc in $SERVICES; do
              # Quy ước profile:
              # - profile: stateful trong env -> app/db.yaml
              # - service "database" -> app/db.yaml (backward compatible)
              # - còn lại -> app/be.yaml
              PROFILE_FILE="app/be.yaml"
              PROFILE=$(awk -v svc="$svc" '
                BEGIN { in_svc=0; profile="" }
                $0 ~ "^[[:space:]]*"svc":[[:space:]]*$" { in_svc=1; next }
                in_svc && $0 ~ "^[^[:space:]]" { in_svc=0 }
                in_svc && $0 ~ "^[[:space:]]+profile:[[:space:]]*stateful[[:space:]]*$" { profile="stateful" }
                END { print profile }
              ' "env/$env.yaml")

              if [ "$svc" = "database" ] || [ "$PROFILE" = "stateful" ]; then
                PROFILE_FILE="app/db.yaml"
              fi

              echo "Render $svc from $PROFILE_FILE -> .manifest/$env/$svc/manifest.yaml"
              mkdir -p ".manifest/$env/$svc"

              helm template "$svc" ./template \
                -f "$PROFILE_FILE" \
                -f "env/$env.yaml" \
                --set "nameOverride=$svc" \
                --set "currentService=$svc" \
                > ".manifest/$env/$svc/manifest.yaml"
            done
          done

          # Auto-generate argocd/manifest-apps/values.yaml from env keys (per-env app list)
          # so App-of-Apps only creates services that exist in each environment.
          {
            echo "repoURL: https://github.com/minhtri1612/learning_RKE2.git"
            echo "name: meostation"
            echo "env: \"\""
            echo "project: \"\""
            echo "cluster: \"\""
            echo "automated: false"
            echo
            echo "appsByEnv:"
            for env in $ENVS; do
              echo "  $env:"
              SERVICES=$(awk '/^[a-zA-Z0-9_-]+:$/ {print substr($1,1,length($1)-1)}' "env/$env.yaml")
              for svc in $SERVICES; do
                if [ "$svc" = "database" ]; then
                  ns="database"
                  wave="0"
                elif [ "$svc" = "frontend" ]; then
                  ns="meo-stationery"
                  wave="2"
                else
                  ns="meo-stationery"
                  wave="1"
                fi

                echo "    $svc:"
                echo "      namespace: $ns"
                echo "      syncWave: \"$wave\""
              done
            done
          } > argocd/manifest-apps/values.yaml

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-render manifests and app list [skip ci]"
          file_pattern: '.manifest/** argocd/manifest-apps/values.yaml'