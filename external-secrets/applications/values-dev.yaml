env: dev

projectName: meo-stationery
# Tên secret trên AWS phải tồn tại. terraform_secret → meo-stationery/dev/app-credentials
# terraform/environments/dev (module secrets) dùng hậu tố -v2 → app-credentials-v2
awsBackendSecretKey: meo-stationery/dev/app-credentials
awsDatabaseSecretKey: meo-stationery/dev/app-credentials

backend:
  refreshInterval: 5m   # shorter so secret updates (e.g. after tf apply) propagate quickly
database:
  refreshInterval: 1h
