# Đồng bộ AWS secret app-credentials → K8s Secret cho backend (namespace meo-stationery).
# Helm backend chart dùng existingSecret.name: "meo-stationery-backend-secrets".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets-{{ .Values.env }}
  namespace: meo-stationery
spec:
  refreshInterval: {{ .Values.backend.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStoreName | default "aws-secrets-manager" }}
    kind: ClusterSecretStore
  target:
    name: meo-stationery-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.awsSecretKey }}
        property: DATABASE_URL
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: {{ .Values.awsSecretKey }}
        property: NEXTAUTH_SECRET
