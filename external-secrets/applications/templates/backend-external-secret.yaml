# Đồng bộ AWS secret app-credentials → K8s Secret cho backend (namespace meo-stationery).
# Helm backend chart dùng existingSecret.name: "meo-stationery-backend-secrets".
{{- $suffix := ternary "-dev" "" (eq .Values.env "dev") -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meo-stationery-backend-secrets{{ $suffix }}
  namespace: meo-stationery
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.backend.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStoreName | default "aws-secrets-manager" }}
    kind: ClusterSecretStore
  target:
    name: meo-stationery-backend-secrets{{ $suffix }}
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.awsBackendSecretKey | default .Values.awsSecretKey }}
        property: DATABASE_URL
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: {{ .Values.awsBackendSecretKey | default .Values.awsSecretKey }}
        property: NEXTAUTH_SECRET
