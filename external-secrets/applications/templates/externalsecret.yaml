{{- range $appName, $appConfig := .Values.secrets }}
{{- if and $appConfig.data (gt (len $appConfig.data) 0) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $appConfig.name | default (printf "%s-%s-secrets" $.Values.projectName $appName) }}{{ include "external-secrets.k8sSecretSuffix" $ }}
  namespace: {{ $appConfig.namespace | default "default" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $appConfig.syncWave | default "-2" | quote }}
spec:
  refreshInterval: {{ $appConfig.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $.Values.secretStoreName | default "aws-secrets-manager" }}
    kind: ClusterSecretStore
  target:
    name: {{ $appConfig.name | default (printf "%s-%s-secrets" $.Values.projectName $appName) }}{{ include "external-secrets.k8sSecretSuffix" $ }}
    creationPolicy: Owner
  data:
    {{- range $item := $appConfig.data }}
    - secretKey: {{ $item.secretKey }}
      remoteRef:
        key: {{ $item.remoteRef.key | default $appConfig.remoteKey | default $.Values.awsSecretKey }}
        property: {{ $item.remoteRef.property }}
    {{- end }}
{{- end }}
{{- end }}
