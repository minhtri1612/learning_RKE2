# Đồng bộ AWS secret app-credentials → K8s Secret postgres (namespace database).
# Helm database chart dùng existingSecret.name: "postgres".

{{- $suffix := ternary "-dev" "" (eq .Values.env "dev") }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meo-stationery-database-secrets{{ $suffix }}
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.database.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStoreName | default "aws-secrets-manager" }}
    kind: ClusterSecretStore
  target:
    name: meo-stationery-database-secrets{{ $suffix }}
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ .Values.awsDatabaseSecretKey | default .Values.awsSecretKey }}
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.awsDatabaseSecretKey | default .Values.awsSecretKey }}
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: {{ .Values.awsDatabaseSecretKey | default .Values.awsSecretKey }}
        property: POSTGRES_DB
