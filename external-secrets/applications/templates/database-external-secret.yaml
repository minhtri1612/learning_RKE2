# Đồng bộ AWS secret app-credentials → K8s Secret postgres (namespace database).
# Helm database chart dùng existingSecret.name: "postgres".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-secrets-{{ .Values.env }}
  namespace: database
spec:
  refreshInterval: {{ .Values.database.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStoreName | default "aws-secrets-manager" }}
    kind: ClusterSecretStore
  target:
    name: postgres
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ .Values.awsSecretKey }}
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.awsSecretKey }}
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: {{ .Values.awsSecretKey }}
        property: POSTGRES_DB
