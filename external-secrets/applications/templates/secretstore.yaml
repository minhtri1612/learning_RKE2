# ClusterSecretStore: ESO dùng AWS credentials từ K8s Secret để đọc Secrets Manager.
# Trước khi apply: tạo secret aws-secrets-credentials trong namespace external-secrets
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStoreName | default "aws-secrets-manager" }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-secrets-credentials
            namespace: external-secrets
            key: access-key
          secretAccessKeySecretRef:
            name: aws-secrets-credentials
            namespace: external-secrets
            key: secret-access-key
