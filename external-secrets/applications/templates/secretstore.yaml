# ClusterSecretStore: ESO dùng AWS credentials từ K8s Secret để đọc Secrets Manager.
# Secret required: aws-credentials (namespace external-secrets) với keys: access-key-id, secret-access-key
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStoreName | default "aws-secrets-manager" }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: secret-access-key
