---
- name: Setup Pure OpenVPN Community Server
  hosts: vpn_server
  become: yes
  vars_files:
    - "group_vars/users.yml"
  vars:
    vpn_network: "10.8.0.0"
    vpn_mask: "255.255.255.0"
    vpc_cidr: "10.0.0.0"
    vpc_mask: "255.255.0.0"
    # openvpn_public_ip: defined via extra vars or inventory

    # Đường dẫn tuyệt đối đến easyrsa trên Debian 12
    easyrsa_bin: "/usr/share/easy-rsa/easyrsa"

  tasks:
    - name: Get default route interface for NAT
      ansible.builtin.shell: ip -o route get 1.1.1.1 | sed -n 's/.* dev \([^ ]*\) .*/\1/p'
      register: default_iface_result
      changed_when: false

    - name: Set VPN physical interface
      ansible.builtin.set_fact:
        vpn_physical_interface: "{{ default_iface_result.stdout | default('eth0') }}"

    - name: Install OpenVPN and Easy-RSA
      apt:
        name: [openvpn, easy-rsa, iptables-persistent]
        state: present
        update_cache: yes
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Create OpenVPN and Server folders
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /etc/openvpn/server
        - /etc/openvpn/server/ccd

    - name: Init PKI and CA
      shell: |
        make-cadir /etc/openvpn/easy-rsa
        cd /etc/openvpn/easy-rsa
        {{ easyrsa_bin }} init-pki
        echo "minhtri-ca" | {{ easyrsa_bin }} build-ca nopass
        {{ easyrsa_bin }} gen-dh
        openvpn --genkey secret /etc/openvpn/server/ta.key
      args:
        creates: /etc/openvpn/easy-rsa/pki/ca.crt

    - name: Generate Server Certificate
      shell: |
        {{ easyrsa_bin }} --batch --pki-dir=/etc/openvpn/easy-rsa/pki gen-req server nopass
        {{ easyrsa_bin }} --batch --pki-dir=/etc/openvpn/easy-rsa/pki sign-req server server
      args:
        creates: /etc/openvpn/easy-rsa/pki/issued/server.crt

    - name: Copy keys to Server folder
      copy:
        src: "/etc/openvpn/easy-rsa/pki/{{ item.src }}"
        dest: "/etc/openvpn/server/{{ item.dest }}"
        remote_src: yes
      with_items:
        - { src: 'ca.crt', dest: 'ca.crt' }
        - { src: 'issued/server.crt', dest: 'server.crt' }
        - { src: 'private/server.key', dest: 'server.key' }
        - { src: 'dh.pem', dest: 'dh.pem' }

    - name: Generate server.conf (vpn_policy + vpn_target từ users.yml)
      copy:
        dest: /etc/openvpn/server/server.conf
        content: |
          port 1194
          proto udp
          dev tun
          topology subnet
          ca ca.crt
          cert server.crt
          key server.key
          dh dh.pem
          tls-auth ta.key 0
          server {{ vpn_network }} {{ vpn_mask }}
          push "route-gateway 10.8.0.1"
          {% for r in vpn_target %}
          push "route {{ r.cidr }} {{ r.mask }}"
          {% endfor %}
          {% if vpn_policy.redirect_gateway | default(false) %}
          push "redirect-gateway def1"
          {% endif %}
          {% for d in vpn_policy.push_dns | default([]) %}
          push "dhcp-option DNS {{ d }}"
          {% endfor %}
          cipher {{ vpn_policy.cipher }}
          auth {{ vpn_policy.auth }}
          keepalive {{ vpn_policy.keepalive }}
          persist-key
          persist-tun
          verb {{ vpn_policy.verb | default('3') }}

    - name: Create TCP client-connect script (fix tun0/tun1 routing conflict)
      copy:
        dest: /etc/openvpn/server/tcp-client-connect.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # When a client connects via TCP (tun1), add a /32 host route via tun1.
          # Without this, kernel routes 10.8.0.0/24 via tun0 (UDP) by default, causing
          # response packets to go to the wrong interface → client never receives them.
          [ -n "$ifconfig_pool_remote_ip" ] && ip route replace "${ifconfig_pool_remote_ip}/32" dev tun1
          exit 0

    - name: Create TCP client-disconnect script (cleanup /32 host route)
      copy:
        dest: /etc/openvpn/server/tcp-client-disconnect.sh
        mode: '0755'
        content: |
          #!/bin/bash
          [ -n "$ifconfig_pool_remote_ip" ] && ip route del "${ifconfig_pool_remote_ip}/32" dev tun1 2>/dev/null || true
          exit 0

    - name: Generate server-tcp.conf (TCP 443 fallback, dev tun1)
      copy:
        dest: /etc/openvpn/server/server-tcp.conf
        content: |
          port 443
          proto tcp-server
          dev tun1
          topology subnet
          ca ca.crt
          cert server.crt
          key server.key
          dh dh.pem
          tls-auth ta.key 0
          server {{ vpn_network }} {{ vpn_mask }}
          push "route-gateway 10.8.0.1"
          {% for r in vpn_target %}
          push "route {{ r.cidr }} {{ r.mask }}"
          {% endfor %}
          {% if vpn_policy.redirect_gateway | default(false) %}
          push "redirect-gateway def1"
          {% endif %}
          client-config-dir ccd
          cipher {{ vpn_policy.cipher }}
          auth {{ vpn_policy.auth }}
          keepalive {{ vpn_policy.keepalive }}
          persist-key
          persist-tun
          verb {{ vpn_policy.verb | default('3') }}
          # Fix: add /32 host route via tun1 on connect to override default tun0 route for same subnet
          script-security 2
          client-connect /etc/openvpn/server/tcp-client-connect.sh
          client-disconnect /etc/openvpn/server/tcp-client-disconnect.sh

    - name: Enable IPv4 Forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present

    # VPN gateway: strict rp_filter hay làm drop reply path (NAT client → VPC → master).
    # 2 = loose (khuyến nghị router/VPN trên Linux).
    - name: Loosen reverse-path filter for VPN forwarding
      sysctl:
        name: "{{ item }}"
        value: "2"
        state: present
        sysctl_set: true
      loop:
        - net.ipv4.conf.all.rp_filter
        - net.ipv4.conf.default.rp_filter

    - name: Map static IPs (CCD)
      copy:
        dest: "/etc/openvpn/server/ccd/{{ item.name }}"
        content: "ifconfig-push {{ item.ip }} {{ vpn_mask }}"
      loop: "{{ vpn_users }}"

    - name: Generate client certificates
      shell: |
        export EASYRSA_REQ_CN="{{ item.name }}"
        {{ easyrsa_bin }} --batch --pki-dir=/etc/openvpn/easy-rsa/pki gen-req {{ item.name }} nopass
        {{ easyrsa_bin }} --batch --pki-dir=/etc/openvpn/easy-rsa/pki sign-req client {{ item.name }}
      args:
        creates: "/etc/openvpn/easy-rsa/pki/issued/{{ item.name }}.crt"
      loop: "{{ vpn_users }}"

    - name: Build .ovpn files for team (vpn_policy)
      shell: |
        set -e
        F="/home/ubuntu/{{ item.name }}.ovpn"
        {
          echo "client"
          echo "dev tun"
          echo "proto udp"
          echo "remote {{ openvpn_public_ip }} 1194"
          echo "resolv-retry infinite"
          echo "nobind"
          echo "persist-key"
          echo "persist-tun"
          echo "remote-cert-tls server"
          echo "cipher {{ vpn_policy.cipher }}"
          echo "auth {{ vpn_policy.auth }}"
          echo "key-direction 1"
          echo "verb {{ vpn_policy.verb | default('3') }}"
          {% if vpn_policy.redirect_gateway | default(false) %}
          echo "redirect-gateway def1"
          {% endif %}
          {% for d in vpn_policy.push_dns | default([]) %}
          echo "dhcp-option DNS {{ d }}"
          {% endfor %}
          echo "<ca>"
          cat /etc/openvpn/server/ca.crt
          echo "</ca>"
          echo "<cert>"
          cat /etc/openvpn/easy-rsa/pki/issued/{{ item.name }}.crt
          echo "</cert>"
          echo "<key>"
          cat /etc/openvpn/easy-rsa/pki/private/{{ item.name }}.key
          echo "</key>"
          echo "<tls-auth>"
          cat /etc/openvpn/server/ta.key
          echo "</tls-auth>"
        } > "$F"
        chown ubuntu:ubuntu "$F"
        chmod 600 "$F"
      loop: "{{ vpn_users }}"
      when: openvpn_public_ip | length > 0

    - name: Build .ovpn TCP fallback (port 443) for team
      ansible.builtin.shell: |
        set -e
        F="/home/ubuntu/{{ item.name }}-tcp.ovpn"
        {
          echo "client"
          echo "dev tun"
          echo "proto tcp-client"
          echo "remote {{ openvpn_public_ip }} 443"
          echo "resolv-retry infinite"
          echo "nobind"
          echo "persist-key"
          echo "persist-tun"
          echo "remote-cert-tls server"
          echo "cipher {{ vpn_policy.cipher }}"
          echo "auth {{ vpn_policy.auth }}"
          echo "key-direction 1"
          echo "verb {{ vpn_policy.verb | default('3') }}"
          {% if vpn_policy.redirect_gateway | default(false) %}
          echo "redirect-gateway def1"
          {% endif %}
          echo "<ca>"
          cat /etc/openvpn/server/ca.crt
          echo "</ca>"
          echo "<cert>"
          cat /etc/openvpn/easy-rsa/pki/issued/{{ item.name }}.crt
          echo "</cert>"
          echo "<key>"
          cat /etc/openvpn/easy-rsa/pki/private/{{ item.name }}.key
          echo "</key>"
          echo "<tls-auth>"
          cat /etc/openvpn/server/ta.key
          echo "</tls-auth>"
        } > "$F"
        chown ubuntu:ubuntu "$F"
        chmod 600 "$F"
      loop: "{{ vpn_users }}"
      when: openvpn_public_ip | length > 0

    - name: Setup IPTables - allow FORWARD from VPN (client -> VPC)
      ansible.builtin.shell: |
        iptables -C FORWARD -s {{ vpn_network }}/24 -j ACCEPT 2>/dev/null || iptables -A FORWARD -s {{ vpn_network }}/24 -j ACCEPT

    - name: Setup IPTables - allow FORWARD to VPN (reply VPC -> client)
      ansible.builtin.shell: |
        iptables -C FORWARD -d {{ vpn_network }}/24 -j ACCEPT 2>/dev/null || iptables -A FORWARD -d {{ vpn_network }}/24 -j ACCEPT

    - name: TCPMSS clamp on forwarded VPN traffic (tránh SYN treo qua tunnel)
      ansible.builtin.shell: |
        iptables -t mangle -C FORWARD -p tcp -m tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || \
        iptables -t mangle -A FORWARD -p tcp -m tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu

    # TCP giờ dùng cùng pool 10.8.0.0/24 với UDP — FORWARD/NAT cho {{ vpn_network }}/24 đã đủ.

    - name: Remove MASQUERADE when vpn_nat is false (keep client source IP for SG 10.8.0.0/24)
      ansible.builtin.shell: |
        while iptables -t nat -D POSTROUTING -s {{ vpn_network }}/24 -o {{ vpn_physical_interface }} -j MASQUERADE 2>/dev/null; do :; done
        for i in ens5 ens4 ens3 eth0 enp0s3 enp0s8; do
          while iptables -t nat -D POSTROUTING -s {{ vpn_network }}/24 -o "$i" -j MASQUERADE 2>/dev/null; do :; done
        done
        iptables -t nat -D POSTROUTING -s {{ vpn_network }}/24 ! -d {{ vpn_network }}/24 -j MASQUERADE 2>/dev/null || true
      when: not (vpn_nat | default(false))

    # MASQUERADE **không** dùng -o: trên AWS NIC hay là ens5; rule -o eth0 sai → không NAT → master thấy 10.8.0.51
    # nhưng reply path dễ fail → curl 6443 timeout. Dùng ! -d VPN pool để SNAT mọi traffic ra VPC / Internet.
    - name: Setup IPTables - MASQUERADE for VPN clients
      ansible.builtin.shell: |
        while iptables -t nat -D POSTROUTING -s {{ vpn_network }}/24 -o {{ vpn_physical_interface }} -j MASQUERADE 2>/dev/null; do :; done
        for i in ens5 ens4 ens3 eth0 enp0s3 enp0s8; do
          while iptables -t nat -D POSTROUTING -s {{ vpn_network }}/24 -o "$i" -j MASQUERADE 2>/dev/null; do :; done
        done
        iptables -t nat -C POSTROUTING -s {{ vpn_network }}/24 ! -d {{ vpn_network }}/24 -j MASQUERADE 2>/dev/null || \
        iptables -t nat -A POSTROUTING -s {{ vpn_network }}/24 ! -d {{ vpn_network }}/24 -j MASQUERADE
      when: vpn_nat | default(false) | bool

    - name: Setup IPTables - Security Rules for Roles
      ansible.builtin.shell: |
        # 1. Admin (sep_tong - 10.8.0.51): Allow ALL
        iptables -C FORWARD -s 10.8.0.51 -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -s 10.8.0.51 -j ACCEPT
        
        # 2. Dev (minhtri - 10.8.0.50):
        # Allow to Dev Network
        iptables -C FORWARD -s 10.8.0.50 -d {{ network_ranges.dev }} -j ACCEPT 2>/dev/null || iptables -I FORWARD 2 -s 10.8.0.50 -d {{ network_ranges.dev }} -j ACCEPT
        
        # BLOCK to Prod Network (Log & Drop)
        iptables -C FORWARD -s 10.8.0.50 -d {{ network_ranges.prod }} -j DROP 2>/dev/null || iptables -I FORWARD 3 -s 10.8.0.50 -d {{ network_ranges.prod }} -j DROP
      when: network_ranges is defined

    - name: Save iptables
      shell: iptables-save > /etc/iptables/rules.v4

    - name: Restart OpenVPN
      systemd:
        name: openvpn-server@server
        state: restarted
        enabled: yes

    - name: Restart OpenVPN TCP (port 443)
      systemd:
        name: openvpn-server@server-tcp
        state: restarted
        enabled: yes
        daemon_reload: yes

    # Tải .ovpn về máy chạy Ansible (cùng kết nối SSH, tránh SCP timeout khi IP đổi)
    - name: Fetch .ovpn files to project root (control node)
      ansible.builtin.fetch:
        src: "/home/ubuntu/{{ item.name }}.ovpn"
        dest: "{{ playbook_dir }}/../"
        flat: yes
      loop: "{{ vpn_users }}"
      when: openvpn_public_ip | length > 0

    - name: Fetch .ovpn TCP files to project root
      ansible.builtin.fetch:
        src: "/home/ubuntu/{{ item.name }}-tcp.ovpn"
        dest: "{{ playbook_dir }}/../"
        flat: yes
      loop: "{{ vpn_users }}"
      when: openvpn_public_ip | length > 0

# --- Play 2: Trên máy chạy Ansible (localhost): tạo file systemd service trong project, in 1 lệnh để bạn chạy trong terminal (sudo hỏi đúng chỗ, không cần -K).
- name: Start VPN client on this machine (so you can ping/SSH private IPs)
  hosts: localhost
  connection: local
  gather_facts: yes
  vars_files: [ "group_vars/users.yml" ]
  vars:
    vpn_service_name: "openvpn-practice-rke2"
  tasks:
    - name: Get project root (parent of ansible/)
      ansible.builtin.shell: cd "{{ playbook_dir }}/.." && pwd
      register: project_root_out
      changed_when: false

    - name: Set project root and first .ovpn file
      ansible.builtin.set_fact:
        project_root: "{{ project_root_out.stdout }}"
        vpn_ovpn_file: "{{ (vpn_users | first).name }}.ovpn"

    - name: Write VPN systemd service file into project
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=OpenVPN for practice_RKE2 (route 10.0.0.0/16)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/sbin/openvpn --config {{ vpn_ovpn_file }}
          WorkingDirectory={{ project_root }}
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        dest: "{{ project_root }}/{{ vpn_service_name }}.service"

    # Không dùng become/sudo trong playbook (tránh lỗi Duplicate become prompt). In 1 lệnh để bạn chạy trong terminal (sudo hỏi đúng chỗ).
    - name: Print one command to start VPN (run in terminal, sudo will prompt)
      ansible.builtin.debug:
        msg:
          - "--- Chạy lệnh sau (sẽ hỏi mật khẩu sudo 1 lần) để VPN chạy nền, sau đó ping/SSH 10.0.x.x ---"
          - "sudo cp {{ project_root }}/{{ vpn_service_name }}.service /etc/systemd/system/ && sudo systemctl daemon-reload && sudo systemctl enable --now {{ vpn_service_name }}"
          - "--- Hoặc chạy VPN trong terminal: cd {{ project_root }} && sudo openvpn --config {{ vpn_ovpn_file }} ---"