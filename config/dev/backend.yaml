# Runtime config cho backend ở môi trường DEV.
# File này được mount vào pod tại /app/config/app.yaml
# Code app đọc file này để biết cách hoạt động.

runtimeConfig:
  data:
    app:
      env: dev
      logLevel: debug

    cache:
      enabled: false

    featureFlags:
      enableMetrics: true
      maintenanceMode: false
