# Base config dùng chung cho mọi môi trường.
# Mọi giá trị khác nhau theo môi trường được override ở config/env/{dev,prod}.yaml

backend:
  # Metadata cho Deployment/Secret (ArgoCD Sync Wave, Namespace)
  namespace: meo-stationery
  syncWave: "-2"
  
  # Cấu hình biến môi trường (theo form mentor)
  configs:
    env:
      - name: PORT
        value: "3000"
      - name: ENABLE_LOGGING
        value: "true"

  # Cấu hình Secret (External Secrets)
  secrets:
    useExternalSecrets: true
    refreshInterval: 1h
    secretStoreRef:
      name: aws-secrets-manager
      kind: ClusterSecretStore
    target:
      creationPolicy: Owner
    data:
      - secretKey: DATABASE_URL
        remoteRef:
          property: DATABASE_URL
      - secretKey: NEXTAUTH_SECRET
        remoteRef:
          property: NEXTAUTH_SECRET

database:
  # Metadata
  namespace: database
  syncWave: "-3"
  # AWS secret dùng hostname "postgres" nhưng Helm tạo service tên "database" (fullnameOverride).
  # Alias này tạo ExternalName service "postgres" → "database.database.svc.cluster.local".
  service:
    aliases:
      - postgres

  # Cấu hình biến môi trường
  configs:
    env:
      - name: POSTGRES_HOST
        value: "localhost"
      - name: POSTGRES_PORT
        value: "5432"

  # Cấu hình Secret
  secrets:
    useExternalSecrets: true
    refreshInterval: 1h
    secretStoreRef:
      name: aws-secrets-manager
      kind: ClusterSecretStore
    target:
      creationPolicy: Owner
    data:
      - secretKey: POSTGRES_USER
        remoteRef:
          property: POSTGRES_USER
      - secretKey: POSTGRES_PASSWORD
        remoteRef:
          property: POSTGRES_PASSWORD
      - secretKey: POSTGRES_DB
        remoteRef:
          property: POSTGRES_DB
