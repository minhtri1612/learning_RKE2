# Runtime config cho backend ở môi trường PROD.
# File này được mount vào pod tại /app/config/app.yaml

runtimeConfig:
  data:
    app:
      env: prod
      logLevel: warn

    cache:
      enabled: true
      host: redis.default.svc.cluster.local
      port: 6379

    featureFlags:
      enableMetrics: true
      maintenanceMode: false
