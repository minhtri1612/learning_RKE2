replicaCount: 10

ingress:
  host: meo-stationery-prod.local

databaseConnection:
  host: prod-database-generic-app.database.svc.cluster.local


workload:
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 10
  maxReplicas: 15

networkPolicy:
  enabled: true

existingSecret:
  name: meo-stationery-backend-secrets
