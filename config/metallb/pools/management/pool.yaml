# Dải IP trên mạng Docker `kind` (thường 172.18.0.0/16). Mỗi cluster Kind cần dải KHÔNG trùng nhau.
# Kiểm tra: docker network inspect kind -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: kind-management-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.18.255.40-172.18.255.49
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-management
  namespace: metallb-system
spec:
  ipAddressPools:
    - kind-management-pool
