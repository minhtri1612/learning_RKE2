kubeProxyReplacement: true

gatewayAPI:
  enabled: true

l7Proxy: true

loadBalancer:
  algorithm: maglev

encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - http
    serviceMonitor:
      enabled: true

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

operator:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
