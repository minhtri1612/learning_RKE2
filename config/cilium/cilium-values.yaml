kubeProxyReplacement: true

gatewayAPI:
  enabled: true
  # App chart (template/) owns GatewayClass; avoid duplicate + operator reconcile issues.
  gatewayClass:
    create: "false"

l7Proxy: true

loadBalancer:
  algorithm: maglev

encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - http
    serviceMonitor:
      enabled: true

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    # Argo compare: cluster đã có CRD ServiceMonitor sau khi sync kube-prometheus-stack (monitoring-*).
    trustCRDsExist: true

operator:
  # Kind thường 1 node: mặc định chart hay để 2 replica + hostPort → pod 2 Pending ("free ports") → Argo Degraded.
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
