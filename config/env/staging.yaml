# STAGING override — Environment-specific Secret/Config mapping.
env: staging
projectName: meo-stationery

backend:
  secrets:
    target:
      name: meo-stationery-backend-secrets-staging
    remoteKey: meo-stationery/staging/app-credentials
    refreshInterval: 1h

database:
  secrets:
    target:
      name: meo-stationery-database-secrets-staging
    remoteKey: meo-stationery/staging/app-credentials
    refreshInterval: 1h

rollout:
  analysis:
    enabled: true
    templates:
      - name: success-rate
        args:
          - name: service-name
            value: backend
        metrics:
          - name: success-rate
            interval: 30s
            count: 4
            successCondition: result[0] >= 0.95
            failureCondition: result[0] < 0.95
            provider:
              prometheus:
                address: http://monitoring-staging-kube-pr-prometheus.monitoring.svc:9090
                query: |
                  sum(up{namespace="monitoring"})
  canary:
    steps:
      - setWeight: 20
      - analysis:
          templates:
            - templateName: success-rate
          args:
            - name: service-name
              value: backend
      - setWeight: 60
      - setWeight: 100
