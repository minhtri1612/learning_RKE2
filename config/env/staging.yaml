# STAGING override — Environment-specific Secret/Config mapping.
env: staging
projectName: meo-stationery

backend:
  secrets:
    target:
      name: meo-stationery-backend-secrets-staging
    remoteKey: meo-stationery/staging/app-credentials
    refreshInterval: 1h

database:
  secrets:
    target:
      name: meo-stationery-database-secrets-staging
    remoteKey: meo-stationery/staging/app-credentials
    refreshInterval: 1h
