# STAGING override — chỉ phần khác so với config/base/

runtimeConfig:
  data:
    # backend
    app:
      env: staging
      logLevel: info
    cache:
      enabled: true

    # database
    max_connections: 50
    shared_buffers: "256MB"
    work_mem: "8MB"
    log_min_duration_statement: 500      # log query > 500ms
