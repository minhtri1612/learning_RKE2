# DEV override — Environment-specific Secret/Config mapping.
env: dev
projectName: meo-stationery
httpRoute:
  hostnames:
    - dev.meo.local
  rules:
    # Smart canary: chỉ request có header x-canary=1 mới vào canary.
    - routeTo: canary
      matches:
        - path:
            type: PathPrefix
            value: /api
          headers:
            - name: x-canary
              value: "1"
    # Mặc định đi stable để tách biệt rõ với canary header-based.
    - routeTo: stable
      matches:
        - path:
            type: PathPrefix
            value: /api
ciliumNetworkPolicy:
  enabled: true
  # Phase 1: keep auth mode empty to avoid hard blocking while validating traffic.
  authenticationMode: ""
  ingress:
    # Lab chỉ có backend + database, cho phép nguồn từ ngoài cluster (world)
    # và traffic nội bộ (cluster) vào backend để quan sát HTTP GET/POST.
    fromEntities:
      - world
      - cluster
    http:
      - method: GET
        path: "/api/.*"
      - method: POST
        path: "/api/.*"
  egress:
    toEndpoints:
      - matchLabels:
          app.kubernetes.io/name: database
          app.kubernetes.io/instance: database
    port: "5432"
    protocol: TCP

backend:
  secrets:
    target:
      name: meo-stationery-backend-secrets-dev
    remoteKey: meo-stationery/dev/app-credentials
    refreshInterval: 5m

database:
  # Dev giữ thêm env vars local-friendly.
  configs:
    env:
      - name: DATABASE_URL
        value: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
  secrets:
    target:
      name: meo-stationery-database-secrets-dev
    # Cùng JSON AWS như backend (khớp terraform_secret / staging); đừng trỏ /database nếu secret đó chưa tạo.
    remoteKey: meo-stationery/dev/app-credentials
    refreshInterval: 1h

rollout:
  strategy: canary
  canary:
    steps:
      - setWeight: 50
      - analysis:
          templates:
            - templateName: success-rate
          args:
            - name: service-name
              value: backend
      - setWeight: 100
  blueGreen:
    activeService: ""
    previewService: ""
    autoPromotionEnabled: true
    scaleDownDelaySeconds: 30
