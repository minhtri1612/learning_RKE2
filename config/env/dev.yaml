# DEV override — Environment-specific Secret/Config mapping.
env: dev
projectName: meo-stationery

backend:
  secrets:
    target:
      name: meo-stationery-backend-secrets-dev
    remoteKey: meo-stationery/dev/app-credentials
    refreshInterval: 5m

database:
  # Dev giữ thêm env vars local-friendly.
  configs:
    env:
      - name: DATABASE_URL
        value: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
  secrets:
    target:
      name: meo-stationery-database-secrets-dev
    # Cùng JSON AWS như backend (khớp terraform_secret / staging); đừng trỏ /database nếu secret đó chưa tạo.
    remoteKey: meo-stationery/dev/app-credentials
    refreshInterval: 1h

rollout:
  analysis:
    enabled: true
    templates:
      - name: success-rate
        args:
          - name: service-name
            value: backend
        metrics:
          - name: success-rate
            interval: 30s
            count: 4
            successCondition: result[0] >= 0.95
            failureCondition: result[0] < 0.95
            provider:
              prometheus:
                address: http://monitoring-dev-kube-promet-prometheus.monitoring.svc:9090
                query: |
                  sum(up{namespace="monitoring"})
  canary:
    steps:
      - setWeight: 50
      - analysis:
          templates:
            - templateName: success-rate
          args:
            - name: service-name
              value: backend
      - setWeight: 100
