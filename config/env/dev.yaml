# DEV override — Environment-specific Secret/Config mapping.
env: dev
projectName: meo-stationery
# Cloud deploy (Path 2): bật NodePort để NLB (Terraform) → NodePort 32080/32443 → Envoy.
# Tắt lại khi chạy Kind/local (Kind dùng MetalLB hoặc port-forward).
gatewayAPI:
  nodePortService:
    enabled: true

httpRoute:
  # DEV owns the full HTTPRoute rule set (base `app/be.yaml` keeps `rules: []`).
  # Reason: Helm replaces lists, so defining rules in both base and env causes silent overrides.
  hostnames:
    - dev.meo.local
  rules:
    # Rule 1: Header-based canary cho QA/beta test chủ động.
    - routeTo: canary
      matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - name: x-canary
              value: "true"
    # Rule 2: Fallback weighted split cho traffic không có header canary.
    # routeTo để trống để chart render backendRefs stable/canary theo stableWeight/canaryWeight.
    - matches:
        - path:
            type: PathPrefix
            value: /
ciliumNetworkPolicy:
  enabled: false
  # Phase 1: keep auth mode empty to avoid hard blocking while validating traffic.
  authenticationMode: ""
  ingress:
    # Lab chỉ có backend + database, cho phép nguồn từ ngoài cluster (world)
    # và traffic nội bộ (cluster) vào backend để quan sát HTTP GET/POST.
    fromEntities:
      - world
      - cluster
    # L7 HTTP rules tạm tắt trên Kind — Envoy proxy single-node gây timeout cho kubelet probe.
    # Bật lại trên cluster nhiều node / RKE2.
    # http:
    #   - method: GET
    #     path: "/api/.*"
    #   - method: POST
    #     path: "/api/.*"
  egress:
    toEndpoints:
      - matchLabels:
          app.kubernetes.io/name: database
          app.kubernetes.io/instance: database
    port: "5432"
    protocol: TCP

backend:
  secrets:
    target:
      name: meo-stationery-backend-secrets-dev
    remoteKey: meo-stationery/dev/app-credentials
    refreshInterval: 5m

database:
  # Dev giữ thêm env vars local-friendly.
  configs:
    env:
      - name: DATABASE_URL
        value: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
  secrets:
    target:
      name: meo-stationery-database-secrets-dev
    # Cùng JSON AWS như backend (khớp terraform_secret / staging); đừng trỏ /database nếu secret đó chưa tạo.
    remoteKey: meo-stationery/dev/app-credentials
    refreshInterval: 1h

rollout:
  strategy: canary
  canary:
    steps:
      - setWeight: 20
      - analysis:
          templates:
            - templateName: success-rate
          args:
            - name: service-name
              value: backend
      - setWeight: 50
      - setWeight: 100
  blueGreen:
    activeService: ""
    previewService: ""
    autoPromotionEnabled: true
    scaleDownDelaySeconds: 30
