# PROD override — Environment-specific Secret/Config mapping.
env: prod
projectName: meo-stationery

backend:
  secrets:
    target:
      name: meo-stationery-backend-secrets-prod
    remoteKey: meo-stationery/prod/app-credentials
    refreshInterval: 1h

database:
  secrets:
    target:
      name: meo-stationery-database-secrets-prod
    remoteKey: meo-stationery/prod/app-credentials
    refreshInterval: 1h

