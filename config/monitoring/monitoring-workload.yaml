# Workload clusters: Prometheus Agent (scrape in-cluster) + remote_write to management Prometheus.
# Management must have prometheus.prometheusSpec.enableRemoteWriteReceiver and NodePort 32090 (monitoring-mgmt.yaml).
# remoteWrite URL: IP của control-plane kind-management trên Docker network `kind` (đổi sau mỗi lần recreate cluster).
#   docker inspect management-control-plane --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}'

fullnameOverride: kps-wl

grafana:
  enabled: false

prometheus:
  enabled: true
  agentMode: true
  prometheusSpec:
    retention: 1d
    storageSpec:
      emptyDir:
        medium: ""
    remoteWrite:
      # Sửa IP cho khớp management-control-plane trên mạng kind (xem comment đầu file).
      - url: http://172.18.0.2:32090/api/v1/write

alertmanager:
  enabled: false

prometheusOperator:
  enabled: true

prometheus-node-exporter:
  enabled: true
  service:
    type: ClusterIP

kube-state-metrics:
  enabled: true
  service:
    type: ClusterIP

# Disable system components to avoid 'kube-system' namespace permission issues in Kind
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
