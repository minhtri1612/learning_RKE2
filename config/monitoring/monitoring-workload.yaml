# Minimal values for workload clusters (Spokes)
# Node-exporter + kube-state-metrics feed the management Prometheus; a local Prometheus
# instance exists so Argo Rollouts analysis can query in-cluster (no cross-cluster Docker IP).

grafana:
  enabled: false

prometheus:
  enabled: true
  prometheusSpec:
    retention: 1d
    storageSpec:
      emptyDir:
        medium: ""

alertmanager:
  enabled: false

prometheusOperator:
  enabled: true # We need the operator to manage the node-exporter and kube-state-metrics

prometheus-node-exporter:
  enabled: true
  service:
    type: ClusterIP

kube-state-metrics:
  enabled: true
  service:
    type: NodePort
    nodePort: 30080

# Disable system components to avoid 'kube-system' namespace permission issues in Kind
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
