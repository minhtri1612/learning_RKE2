grafana:
  adminPassword: "admin"
  enabled: true
  service:
    type: NodePort
    nodePort: 32000

prometheus:
  enabled: true
  # Expose for cross-cluster Rollouts analysis; IP in config/env/*.yaml = mgmt control-plane on kind network.
  service:
    type: NodePort
    nodePort: 32090
    port: 9090
  prometheusSpec:
    retention: 1d
    storageSpec:
      emptyDir:
        medium: ""
    additionalScrapeConfigs:
      - job_name: 'kubernetes-nodes-dev'
        static_configs:
          - targets: ['172.18.0.5:9100', '172.18.0.5:30080']
      - job_name: 'kubernetes-nodes-staging'
        static_configs:
          - targets: ['172.18.0.6:9100', '172.18.0.6:30080']
      - job_name: 'kubernetes-nodes-prod'
        static_configs:
          - targets: ['172.18.0.8:9100', '172.18.0.8:30080']

# Disable components that we don't need for management
alertmanager:
  enabled: false
