# ==========================================
# PLATFORM GUARDRAILS BASELINE (SHARED)
# Shared defaults and schema across environments.
# ==========================================

platform_network:
  enable_tls: false

app_tiers:
  default_tier: "micro"
  allowed_tiers: ["micro", "small", "medium"]
  profiles:
    micro:
      replicas: 1
      cpu_limit: "100m"
      ram_limit: "128Mi"
    small:
      replicas: 1
      cpu_limit: "250m"
      ram_limit: "256Mi"
    medium:
      replicas: 2
      cpu_limit: "500m"
      ram_limit: "512Mi"
    xlarge:
      replicas: 4
      cpu_limit: "2000m"
      ram_limit: "4Gi"

db_tiers:
  default_tier: "dev-basic"
  profiles:
    dev-basic:
      storage_class: "local-path"
      storage_size: "5Gi"
      ram_limit: "512Mi"
    dev-heavy:
      storage_class: "local-path"
      storage_size: "20Gi"
      ram_limit: "2Gi"
    prod-basic:
      storage_class: "longhorn"
      storage_size: "50Gi"
      ram_limit: "4Gi"
    prod-heavy:
      storage_class: "longhorn"
      storage_size: "200Gi"
      ram_limit: "16Gi"
