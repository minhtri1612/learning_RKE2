global:
  environment: "dev"
  cluster_name: "rke2-dev-local"

platform_network:
  base_domain: "dev.meo-stationery.internal"
  enable_tls: false

app_tiers:
  default_tier: "micro"
  allowed_tiers: ["micro", "small", "medium"]
  profiles:
    micro:
      replicas: 1
      cpu_limit: "100m"
      ram_limit: "128Mi"
    small:
      replicas: 1
      cpu_limit: "250m"
      ram_limit: "256Mi"
    medium:
      replicas: 2
      cpu_limit: "500m"
      ram_limit: "512Mi"

db_tiers:
  default_tier: "dev-basic"
  profiles:
    dev-basic:
      storage_class: "local-path"
      storage_size: "5Gi"
      ram_limit: "512Mi"
    dev-heavy:
      storage_class: "local-path"
      storage_size: "20Gi"
      ram_limit: "2Gi"
