env: ""
project: ""
destination: ""

backend:
  namespace: meo-stationery
  replicaCount: 2
  # existingSecret, workload, ingress... override trong values-dev.yaml / values-prod.yaml

database:
  namespace: database
  # existingSecret, replicas, persistence... override trong values-dev.yaml / values-prod.yaml
