# ===== APP DEFINITION SCHEMA =====
# File này được Git Generator đọc và inject vào ApplicationSet template.
# Mọi field ở đây đều available trong appset template dưới dạng {{fieldName}}.

# --- Required ---
name: database                     # tên app
path: k8s_helm/database            # path đến Helm chart
namespace: database                # namespace deploy trên cluster
syncWave: "1"                      # sync trước backend (wave 1)

# --- Image Updater ---
# Database (postgres) dùng image từ DockerHub official, không cần auto-update qua Image Updater.
# Set thành "" → Image Updater bỏ qua app này.
dockerImage: ""

# --- Migration ---
# Database không có migration job — migration chạy từ backend app.
hasMigration: "false"
