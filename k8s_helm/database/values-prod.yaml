# Prod overrides (merged với values.yaml)
# Prod: dùng secrets từ AWS Secrets Manager qua External Secrets Operator.
# ExternalSecret prod tạo Secret "meo-stationery-database-secrets" trong namespace database.
existingSecret:
  name: "meo-stationery-database-secrets"
auth:
  username: meo_admin
  database: meo_stationery
  password: ""  # password lấy từ Secret, không set trong Git
persistence:
  size: 10Gi
  useEBS: true
  provisionStorageClass: false
