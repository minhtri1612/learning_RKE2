{{- if ne (.Values.workload.kind | default "deployment") "statefulset" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "generic-app.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
  {{- with .Values.argocd }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .syncWave | default "0" | quote }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "generic-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "generic-app.selectorLabels" . | nindent 8 }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - {{ include "generic-app.name" . }}
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      {{- if .Values.initContainer.enabled }}
      initContainers:
      - name: wait-for-postgres
        image: {{ .Values.initContainer.image }}
        command: ['sh', '-c', 'until nc -z {{ .Values.databaseConnection.host }} {{ .Values.databaseConnection.port }}; do echo waiting for postgres; sleep 2; done;']
        resources:
          {{- toYaml .Values.initContainer.resources | nindent 10 }}
      {{- end }}
      containers:
      - name: {{ .Values.app.name }}
        {{- if kindIs "string" .Values.workload.image }}
        image: {{ .Values.workload.image | quote }}
        imagePullPolicy: {{ .Values.workload.imagePullPolicy | default "Always" }}
        {{- else }}
        image: "{{ .Values.workload.image.repository }}:{{ .Values.workload.image.tag }}"
        imagePullPolicy: {{ .Values.workload.image.pullPolicy | default "Always" }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.path }}
            port: {{ .Values.probes.port }}
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
        readinessProbe:
          httpGet:
            path: {{ .Values.probes.path }}
            port: {{ .Values.probes.port }}
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
        startupProbe:
          httpGet:
            path: {{ .Values.probes.path }}
            port: {{ .Values.probes.port }}
          failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          periodSeconds: {{ .Values.probes.startup.periodSeconds }}
        envFrom:
        - configMapRef:
            name: {{ include "generic-app.fullname" . }}-configmap
        - secretRef:
            name: {{ default (printf "%s-secret" (include "generic-app.fullname" .)) .Values.existingSecret.name }}
        env: []
        resources:
          requests:
            memory: {{ .Values.workload.resources.requests.memory }}
            cpu: {{ .Values.workload.resources.requests.cpu }}
          limits:
            memory: {{ .Values.workload.resources.limits.memory }}
            cpu: {{ .Values.workload.resources.limits.cpu }}
        ports:
        {{- toYaml .Values.workload.ports | nindent 8 }}
{{- end }}
