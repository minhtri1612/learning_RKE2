# DockerHost resources for Prod – apply to Management cluster.
# Operator (Management) connects to these IPs via VPC peering (port 2376).
 # Sau terraform apply prod: terraform -chdir=terraform/environments/prod output -json docker_host_private_ips
# Thay REPLACE_PROD_IP_* bằng IP thật từ output.
---
apiVersion: kdop.io.vn/v1alpha1
kind: DockerHost
metadata:
  name: prod-docker-host-1
  namespace: default
spec:
  hostURL: "tcp://REPLACE_PROD_IP_1:2376"
---
apiVersion: kdop.io.vn/v1alpha1
kind: DockerHost
metadata:
  name: prod-docker-host-2
  namespace: default
spec:
  hostURL: "tcp://REPLACE_PROD_IP_2:2376"
