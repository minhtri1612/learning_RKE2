backend:
  name: backend-deployment
  namespace: meo-stationery

argocd:
  syncWave: "0"

namespace: ""

workload:
  image: minhtri1612/rke2:2.0.1
  resources:
    requests:
      memory: "256Mi"
      cpu: "128m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  ports:
    - containerPort: 3000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

serviceAccount:
  create: false

replicaCount: 2

config:
  nextAuthUrl: "http://meo-stationery.local"

database:
  fullnameOverride: "postgres"
  namespace: "database"
  auth:
    username: "meo_admin"
    database: "meo_stationery"
    password: ""

migration:
  enabled: true

existingSecret:
  name: ""

secret:
  nextAuthSecret: ""

httpRoute:
  enabled: false

ingress:
  enabled: true
  host: meo-stationery.local
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  tls:
    enabled: false
    secretName: meo-stationery-tls

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80

networkPolicy:
  enabled: false
