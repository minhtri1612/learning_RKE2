apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.fullname" . }}-configmap
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  {{- with .Values.argocd }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .syncWave | default "0" | quote }}
  {{- end }}
data:
  NEXTAUTH_URL: {{ .Values.config.nextAuthUrl | quote }}
  NODE_ENV: "production"
