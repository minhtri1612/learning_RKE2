apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.fullname" . }}-configmap
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    # Apply trước migration job (wave -1) để PreSync hook pod mount được ConfigMap
    argocd.argoproj.io/sync-wave: "-2"
data:
  NEXTAUTH_URL: {{ .Values.config.nextAuthUrl | quote }}
  NODE_ENV: "production"
