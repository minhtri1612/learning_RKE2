# ===== APP DEFINITION SCHEMA =====
# File này được Git Generator đọc và inject vào ApplicationSet template.
# Mọi field ở đây đều available trong appset template dưới dạng {{fieldName}}.
# KHÔNG thêm field nào không có trong appset template — sẽ bị ignore silently.

# --- Required ---
name: backend                      # tên app, dùng trong Application name và image updater
path: k8s_helm/backend             # path đến Helm chart
namespace: meo-stationery          # namespace deploy trên cluster
syncWave: "5"                      # thứ tự sync (database=1, backend=5)

# --- Image Updater ---
# dockerImage: image repo trên DockerHub/registry
# Image Updater sẽ watch image này và auto-update tag khi có version semver mới
# Set thành "" để disable Image Updater cho app này
dockerImage: "minhtri1612/meo-stationery-backend"

# --- Migration ---
# hasMigration: "true" nếu app có PreSync migration job
# Dùng để label Application (informational, không ảnh hưởng sync logic)
hasMigration: "true"
