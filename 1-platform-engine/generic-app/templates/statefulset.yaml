{{- if eq (.Values.workload.kind | default "deployment") "statefulset" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "generic-app.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
  {{- with .Values.argocd }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .syncWave | default "0" | quote }}
  {{- end }}
spec:
  serviceName: {{ include "generic-app.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "generic-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "generic-app.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: {{ .Values.statefulset.fsGroup | default 999 }}
      containers:
      - name: {{ .Values.app.name | default .Chart.Name }}
        {{- if kindIs "string" .Values.workload.image }}
        image: {{ .Values.workload.image | quote }}
        imagePullPolicy: {{ .Values.workload.imagePullPolicy | default "Always" }}
        {{- else }}
        image: "{{ .Values.workload.image.repository }}:{{ .Values.workload.image.tag }}"
        imagePullPolicy: {{ .Values.workload.image.pullPolicy | default "Always" }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.statefulset.containerPort | default 5432 }}
          name: {{ .Values.statefulset.portName | default "postgres" }}
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          exec:
            command:
              - "pg_isready"
              - "-U"
              - "{{ .Values.auth.username }}"
              - "-d"
              - "{{ .Values.auth.database }}"
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.livenessProbe.successThreshold }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        {{- end }}
        {{- include "generic-app.resources" . | nindent 8 }}
        env:
        - name: PGDATA
          value: {{ .Values.statefulset.pgdataPath | default "/var/lib/postgresql/data/pgdata" }}
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: {{ default (include "generic-app.fullname" .) .Values.existingSecret.name }}
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ default (include "generic-app.fullname" .) .Values.existingSecret.name }}
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ default (include "generic-app.fullname" .) .Values.existingSecret.name }}
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: {{ .Values.statefulset.volumeName | default "app-storage" }}
          mountPath: {{ .Values.statefulset.mountPath | default "/var/lib/postgresql/data" }}
          subPath: {{ .Values.statefulset.subPath | default "pgdata" }}
  volumeClaimTemplates:
  - metadata:
      name: {{ .Values.statefulset.volumeName | default "app-storage" }}
    spec:
      accessModes:
      - ReadWriteOnce
      {{- if .Values.persistence.useEBS }}
      storageClassName: ebs-sc
      {{- else if .Values.persistence.storageClassName }}
      storageClassName: {{ .Values.persistence.storageClassName | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ index .Values.db_tiers.profiles .Values.db_tier "storage_size" }}
{{- end }}

