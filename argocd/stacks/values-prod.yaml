# ============================================================================
# PROD ENVIRONMENT OVERRIDES (Dog extends Animal)
# ============================================================================
# Chỉ ghi ở đây những cái KHÁC so với values.yaml (base)
# Những cái giống base sẽ TỰ ĐỘNG thừa hưởng từ values.yaml
# ============================================================================

env: prod
project: prod
cluster: prod
automated: false     # 🔴 PROD: Manual sync (cẩn thận hơn)

apps:
  # ============ BACKEND OVERRIDES FOR PROD ============
  backend:
    targetRevision: v1.2.5   # 🔴 Prod: dùng stable version tag
    values:
      # Override từ base: 6 replicas cho prod (HA đầy đủ)
      replicaCount: 6
      
      # Override từ base: prod dùng secrets từ AWS
      existingSecret:
        name: "meo-stationery-backend-secrets"
      
      # Override từ base: bigger resources cho prod
      resources:
        requests:
          memory: "256Mi"
          cpu: "128m"
        limits:
          memory: "2Gi"
          cpu: "1000m"
      
      # Override từ base: enable autoscaling cho prod
      autoscaling:
        enabled: true
        minReplicas: 6
        maxReplicas: 12    # 🔴 Prod: higher ceiling
      
      # Override từ base: prod hostname khác
      ingress:
        host: "meo-stationery-prod.local"
      
      # Override từ base: ENABLE network policy cho prod (security!)
      networkPolicy:
        enabled: true
  
  # ============ DATABASE OVERRIDES FOR PROD ============
  database:
    targetRevision: v1.2.4   # 🔴 Prod: dùng stable version tag
    values:
      # Override từ base: prod dùng secrets từ AWS
      existingSecret:
        name: "meo-stationery-database-secrets"
      
      # Override từ base: bigger storage cho prod
      persistence:
        size: 10Gi
        # useEBS: false (thừa hưởng từ base, nhưng dev có thể enable nếu AWS)
      
      # Thừa hưởng từ base:
      # - replicas: 1
      # - auth settings
