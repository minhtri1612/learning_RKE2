# ============================================================================
# DEV ENVIRONMENT OVERRIDES (Cat extends Animal)
# ============================================================================
# Chỉ ghi ở đây những cái KHÁC so với values.yaml (base)
# Những cái giống base sẽ TỰ ĐỘNG thừa hưởng từ values.yaml
# ============================================================================

env: dev
project: dev
cluster: dev
automated: true      # 🔵 DEV: Auto-sync enabled

apps:
  # ============ BACKEND OVERRIDES FOR DEV ============
  backend:
    targetRevision: kind   # 🔵 Dev: dùng kind branch (latest dev code)
    values:
      # Override từ base: 3 replicas cho dev
      replicaCount: 3
      
      # Override từ base: dev dùng secrets từ AWS
      existingSecret:
        name: "meo-stationery-backend-secrets-dev"
      
      # Override từ base: enable autoscaling cho dev
      autoscaling:
        enabled: true
        minReplicas: 3
        maxReplicas: 5
      
      # Override từ base: dev hostname khác
      ingress:
        host: "meo-stationery-dev.local"
  
  # ============ DATABASE OVERRIDES FOR DEV ============
  database:
    targetRevision: kind   # 🔵 Dev: dùng kind branch
    values:
      # Override từ base: dev dùng secrets từ AWS
      existingSecret:
        name: "meo-stationery-database-secrets-dev"
      
      # Thừa hưởng từ base:
      # - replicas: 1
      # - persistence.size: 5Gi
      # - persistence.useEBS: false
