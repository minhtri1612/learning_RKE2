env: dev
project: dev
cluster: dev
automated: true

apps:
  - name: backend
    path: k8s_helm/backend
    namespace: meo-stationery
    targetRevision: kind
    values:
      existingSecret:
        name: "meo-stationery-backend-secrets-dev"
      replicaCount: 3
      workload:
        image: minhtri1612/meo-stationery-backend:vcl
        resources:
          requests:
            memory: "128Mi"
            cpu: "64m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      autoscaling:
        enabled: true
        minReplicas: 3
        maxReplicas: 5
        targetCPUUtilizationPercentage: 80
      ingress:
        enabled: false
        host: meo-stationery-dev.local

  - name: database
    path: k8s_helm/database
    namespace: database
    targetRevision: kind
    values:
      existingSecret:
        name: "meo-stationery-database-secrets-dev"
      auth:
        username: meo_admin
        database: meo_stationery
        password: ""
      persistence:
        useEBS: false
      replicas: 1
