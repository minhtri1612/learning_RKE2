{{- range $key, $app := .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $.Values.env }}-{{ $app.name }}-stack
  namespace: argocd
  labels:
    env: {{ $.Values.env }}
spec:
  project: {{ $.Values.project }}
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $app.targetRevision }}
    path: {{ $app.path }}
    helm:
      values: |
        {{ toYaml $app.values | nindent 8 }}
  destination:
    name: {{ $.Values.cluster }}
    namespace: {{ $app.namespace }}
  syncPolicy:
    {{- if $.Values.automated }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
---
{{- end }}
