{{- range .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $.Values.env }}-{{ .name }}-stack
  namespace: argocd
  labels:
    env: {{ $.Values.env }}
spec:
  project: {{ $.Values.project }}
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ .targetRevision }}
    path: {{ .path }}
    helm:
      values: |
        {{ toYaml .values | nindent 8 }}
  destination:
    name: {{ $.Values.cluster }}
    namespace: {{ .namespace }}
  syncPolicy:
    {{- if $.Values.automated }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
---
{{- end }}
