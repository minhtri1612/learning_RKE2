apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env }}-database-stack
  namespace: argocd
  labels:
    env: {{ .Values.env }}
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.database.targetRevision }}
    path: k8s_helm/database
    helm:
      values: |
        {{ toYaml .Values.database.values | nindent 8 }}
  destination:
    name: {{ .Values.cluster }}
    namespace: database
  syncPolicy:
    {{- if .Values.automated }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
