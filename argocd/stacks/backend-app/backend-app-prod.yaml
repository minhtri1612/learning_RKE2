apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-app-prod
  namespace: argocd
  labels:
    env: prod
spec:
  project: prod
  sources:
    - repoURL: https://github.com/minhtri1612/learning_RKE2.git
      targetRevision: v1.2.3  # PINNED chart version
      path: k8s_helm/backend
      helm:
        valueFiles:
          - values.yaml
          - $values/argocd/env-values/prod/backend-values.yaml
    - repoURL: https://github.com/minhtri1612/learning_RKE2.git
      targetRevision: kind    # env-values luôn lấy từ branch hiện tại
      ref: values
  destination:
    name: prod
    namespace: meo-stationery
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
