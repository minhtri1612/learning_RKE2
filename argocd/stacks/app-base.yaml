# ─── XƯƠNG SỐNG APP (base) ───
# DevOps định nghĩa chartPath, namespace, syncWave.
# Values nằm trong values/app/<service>.yaml và values/env/<env>/<service>.yaml.

apps:
  backend:
    name: backend
    chartPath: k8s_helm/generic-app
    namespace: meo-stationery
    targetRevision: kind
    syncWave: "1"

  database:
    name: database
    chartPath: k8s_helm/generic-app
    namespace: database
    targetRevision: kind
    syncWave: "0"
