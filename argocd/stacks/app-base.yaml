# ─── XƯƠNG SỐNG APP (base) + config theo môi trường (DevOps) ───
# Developer chỉ sửa version trong environments/*.yaml. Phần còn lại ở đây.

apps:
  backend:
    name: backend
    path: k8s_helm/backend
    namespace: meo-stationery
    targetRevision: main
    values:
      replicaCount: 2
      workload:
        # Default; tag thật lấy từ environments/*.yaml (services.backend.version).
        image: minhtri1612/rke2:2.0.1
      resources:
        requests:
          memory: "256Mi"
          cpu: "128m"
        limits:
          memory: "1Gi"
          cpu: "500m"
      autoscaling:
        enabled: false
        minReplicas: 2
        maxReplicas: 4
      ingress:
        enabled: true
        host: meo-stationery.local
        annotations:
          nginx.ingress.kubernetes.io/rewrite-target: "/"
          nginx.ingress.kubernetes.io/ssl-redirect: "false"
    envOverrides:
      dev:
        replicaCount: 3
        ingress:
          host: meo-stationery-dev.local
        existingSecret:
          name: meo-stationery-backend-secrets-dev
        autoscaling:
          enabled: true
          minReplicas: 3
          maxReplicas: 5
      prod:
        replicaCount: 6
        ingress:
          host: meo-stationery-prod.local
        existingSecret:
          name: meo-stationery-backend-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        autoscaling:
          enabled: true
          minReplicas: 6
          maxReplicas: 12
        networkPolicy:
          enabled: true

  database:
    name: database
    path: k8s_helm/database
    namespace: database
    targetRevision: main
    values:
      replicas: 1
      auth:
        username: meo_admin
        database: meo_stationery
        password: ""
      persistence:
        size: 5Gi
        useEBS: false
        provisionStorageClass: false
    envOverrides:
      dev:
        existingSecret:
          name: meo-stationery-database-secrets-dev
      prod:
        existingSecret:
          name: meo-stationery-database-secrets
        persistence:
          size: 10Gi
          useEBS: true
