apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - app: external-secrets
            path: infrastructure/external-secrets
            namespace: external-secrets
      - list:
          elements:
          - env: dev
            server: https://10.1.101.198:6443
          - env: prod
            server: https://10.2.101.11:6443
  template:
    metadata:
      name: 'infra-{{app}}-{{env}}'
      namespace: argocd
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/minhtri1612/learning_RKE2.git
        targetRevision: main
        path: '{{path}}'
        helm:
          valueFiles:
          - values.yaml
          - values-{{env}}.yaml
      destination:
        server: '{{server}}'
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
