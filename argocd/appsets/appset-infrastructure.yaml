apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - app: external-secrets
            path: infrastructure/external-secrets
            namespace: external-secrets
      - list:
          elements:
          - env: dev
            clusterName: dev
          - env: prod
            clusterName: prod
  template:
    metadata:
      name: 'infra-{{app}}-{{env}}'
      namespace: argocd
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/minhtri1612/learning_RKE2.git
        targetRevision: main
        path: '{{path}}'
        helm:
          valueFiles:
          - values.yaml
          - values-{{env}}.yaml
      destination:
        name: '{{clusterName}}'
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
