apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure-apps
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - cluster: dev
        url: https://10.1.101.234:6443
      - cluster: prod
        url: https://10.2.101.84:6443
  template:
    metadata:
      name: '{{cluster}}-ingress-nginx'
    spec:
      project: infrastructure
      source:
        repoURL: https://kubernetes.github.io/ingress-nginx
        chart: ingress-nginx
        targetRevision: 4.8.3
        helm:
          values: |
            controller:
              service:
                type: LoadBalancer
      destination:
        server: '{{url}}'
        namespace: ingress-nginx
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
