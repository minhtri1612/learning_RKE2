# App generic: definitions trong argocd/apps/definitions/*.yaml
# Config theo env: argocd/apps/config/*.yaml (dev.yaml, prod.yaml). Thêm env = thêm file config.
# Matrix: config (env) × definitions (app) → Application cho từng cặp
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      # Config dựa trên môi trường: mỗi file trong config/ = 1 env (dev, prod)
      - git:
          repoURL: https://github.com/minhtri1612/learning_RKE2.git
          revision: main
          pathParamPrefix: env
          files:
          - path: "argocd/apps/config/*.yaml"
      # App generic: mỗi file trong definitions/ = 1 app (name, path, namespace, syncWave)
      - git:
          repoURL: https://github.com/minhtri1612/learning_RKE2.git
          revision: main
          pathParamPrefix: app
          files:
          - path: "argocd/apps/definitions/*.yaml"
  template:
    metadata:
      name: 'meo-station-{{.name}}-{{.env}}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{.syncWave}}'
    spec:
      project: '{{.project}}'
      source:
        repoURL: https://github.com/minhtri1612/learning_RKE2.git
        targetRevision: '{{.targetRevision}}'
        path: '{{.path}}'
        helm:
          valueFiles:
          - values.yaml
          - values-{{.valueFileSuffix}}.yaml
      destination:
        name: '{{.clusterName}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - RespectIgnoreDifferences=true
      ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
        - /spec/replicas
      - group: apps
        kind: StatefulSet
        jsonPointers:
        - /spec/replicas
      - group: autoscaling
        kind: HorizontalPodAutoscaler
        jsonPointers:
        - /status
        - /metadata/annotations
      - group: ""
        kind: Secret
        jsonPointers:
        - /data
      - group: ""
        kind: Service
        jsonPointers:
        - /metadata/annotations
