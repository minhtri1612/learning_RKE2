# App generic: definitions trong argocd/apps/definitions/*.yaml
# Config theo env: argocd/apps/config/*.yaml (dev.yaml, prod.yaml). Thêm env = thêm file config.
# Matrix: config (env) × definitions (app) → Application cho từng cặp
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
spec:
  generators:
  - matrix:
      generators:
      # Config dựa trên môi trường: mỗi file trong config/ = 1 env (dev, prod)
      - git:
          repoURL: https://github.com/minhtri1612/learning_RKE2.git
          revision: main
          # Đổi tên tham số path của generator thành env.path để tránh đụng với definitions
          pathParamPrefix: env
          files:
          - path: "argocd/apps/config/*.yaml"
      # App generic: mỗi file trong definitions/ = 1 app (name, path, namespace, syncWave)
      - git:
          repoURL: https://github.com/minhtri1612/learning_RKE2.git
          revision: main
          # Đổi tên tham số path của generator thành app.path để tránh đụng với config
          pathParamPrefix: app
          files:
          - path: "argocd/apps/definitions/*.yaml"
  template:
    metadata:
      # ví dụ: meo-station-backend-dev
      name: 'meo-station-{{name}}-{{env}}'
      namespace: argocd
      annotations:
        # syncWave lấy từ app definition (database=1, backend=5)
        argocd.argoproj.io/sync-wave: '{{syncWave}}'
        # Slack notifications – gửi vào #new-channel khi deploy/sync failed/degraded
        notifications.argoproj.io/subscribe.on-deployed.slack: new-channel
        notifications.argoproj.io/subscribe.on-sync-failed.slack: new-channel
        notifications.argoproj.io/subscribe.on-health-degraded.slack: new-channel
    spec:
      # project per env (dev/prod) lấy từ config
      project: '{{project}}'
      source:
        repoURL: https://github.com/minhtri1612/learning_RKE2.git
        # branch/tag per env
        targetRevision: '{{targetRevision}}'
        # đường dẫn chart Helm từ app definition
        path: '{{path}}'
        helm:
          valueFiles:
          - values.yaml
          - values-{{valueFileSuffix}}.yaml
      destination:
        # tên cluster ArgoCD (dev/prod)
        name: '{{clusterName}}'
        # namespace deploy app
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - RespectIgnoreDifferences=true
      ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
        - /spec/replicas
      - group: apps
        kind: StatefulSet
        jsonPointers:
        - /spec/replicas
      - group: autoscaling
        kind: HorizontalPodAutoscaler
        jsonPointers:
        - /status
        - /metadata/annotations
      - group: ""
        kind: Secret
        jsonPointers:
        - /data
      - group: ""
        kind: Service
        jsonPointers:
        - /metadata/annotations
