apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-meostation-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: prod
  source:
    repoURL: https://github.com/minhtri1612/learning_RKE2.git
    targetRevision: kind
    path: argocd/stacks
    directory:
      recurse: true
      include: "*-prod.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

