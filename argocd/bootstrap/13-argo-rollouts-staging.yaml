apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts-staging
  namespace: argocd
spec:
  project: staging
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.40.9
  destination:
    name: staging
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
