apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts-staging
  namespace: argocd
spec:
  project: staging
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-rollouts
      targetRevision: 2.40.9
      helm:
        valueFiles:
          - $values/argocd/argo-rollouts-values.yaml
    - repoURL: https://github.com/minhtri1612/learning_RKE2.git
      targetRevision: main
      ref: values
  destination:
    name: staging
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
