apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-prod
  namespace: argocd
spec:
  project: prod
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.19.2
      helm:
        valueFiles:
          - $values/config/cilium/cilium-values.yaml
    - repoURL: https://github.com/minhtri1612/learning_RKE2.git
      targetRevision: main
      ref: values
  destination:
    name: prod
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
