apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts-prod
  namespace: argocd
spec:
  project: prod
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.40.9
  destination:
    name: prod
    namespace: argo-rollouts
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
