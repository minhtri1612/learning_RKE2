apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: dev
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.19.2
      helm:
        valueFiles:
          - $values/cilium/cilium-values.yaml
          - $values/cilium/cilium-cluster-dev.yaml
          - $values/cilium/clustermesh-management-peer.yaml
          - $values/cilium/cilium-values-spoke-bootstrap.yaml
    - repoURL: https://github.com/minhtri1612/learning_RKE2.git
      targetRevision: main
      ref: values
  destination:
    name: dev
    namespace: kube-system
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-relay-client-certs
      namespace: kube-system
      jsonPointers:
        - /data
    # ClusterMesh TLS secrets are regenerated by chart rendering.
    # Ignore data drift to avoid perpetual OutOfSync while app stays Healthy.
    - group: ""
      kind: Secret
      name: clustermesh-apiserver-admin-cert
      namespace: kube-system
      jsonPointers:
        - /data
        - /stringData
      jqPathExpressions:
        - .data
        - .stringData
    - group: ""
      kind: Secret
      name: clustermesh-apiserver-local-cert
      namespace: kube-system
      jsonPointers:
        - /data
        - /stringData
      jqPathExpressions:
        - .data
        - .stringData
    - group: ""
      kind: Secret
      name: clustermesh-apiserver-remote-cert
      namespace: kube-system
      jsonPointers:
        - /data
        - /stringData
      jqPathExpressions:
        - .data
        - .stringData
    - group: ""
      kind: Secret
      name: clustermesh-apiserver-server-cert
      namespace: kube-system
      jsonPointers:
        - /data
        - /stringData
      jqPathExpressions:
        - .data
        - .stringData
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
