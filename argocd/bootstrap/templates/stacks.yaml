{{- range .Values.environments }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}-meostation-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    environment: {{ .name }}
spec:
  project: {{ .project }}
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.targetRevision }}
    path: argocd/stacks
    helm:
      valueFiles:
        - values.yaml
        - app-base.yaml
        - ../../environments/{{ .name }}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    {{- if .automated }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
---
{{- end }}