apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-prod
  namespace: argocd
spec:
  project: prod
  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.15.3
      helm:
        releaseName: metallb
        valueFiles:
          - $values/config/metallb/metallb-common.yaml
    - repoURL: https://github.com/minhtri1612/learning_RKE2.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/minhtri1612/learning_RKE2.git
      path: config/metallb/pools/prod
      targetRevision: main
  destination:
    name: prod
    namespace: metallb-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
