---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-meostation
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: staging
  source:
    repoURL: https://github.com/minhtri1612/learning_RKE2.git
    targetRevision: feature/bluegreen-rollout
    path: argocd/manifest-apps
    helm:
      valueFiles:
        - ../../env/staging.yaml
      parameters:
        - name: env
          value: staging
        - name: project
          value: staging
        - name: cluster
          value: staging
        - name: automated
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
