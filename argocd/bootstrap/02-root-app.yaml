# Root Application - App of Apps (ApplicationSets Pattern)
# 
# This root app syncs ApplicationSets which auto-generate Applications for all environments.
#
# Setup:
# 1. Apply projects: kubectl apply -f argocd/projects/
# 2. Apply RBAC: kubectl apply -f argocd/rbac/
# 3. Apply root app: kubectl apply -f argocd/bootstrap/02-root-app.yaml
#
# ApplicationSet "applications" (trong appsets): đọc argocd/apps/definitions/* + list env (dev, prod) → sinh app × env.
# ApplicationSet "infrastructure-apps": ingress-nginx, etc.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-projects
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/minhtri1612/learning_RKE2.git
    targetRevision: main
    path: argocd/projects
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-clusters
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/minhtri1612/learning_RKE2.git
    targetRevision: main
    path: argocd/clusters
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: ""
      kind: Secret
      jqPathExpressions:
        - .data.config
        - .stringData.config
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
