# Root Application - App of Apps (chỉ Application, không ApplicationSet)
#
# Root app sync folder argocd/applications → tạo các app con (app in app).
#
# Setup:
# 1. Apply projects: kubectl apply -f argocd/projects/
# 2. Apply RBAC: kubectl apply -f argocd/rbac/
# 3. Apply root app: kubectl apply -f argocd/bootstrap/02-root-app.yaml
#
# argocd/applications/: meo-station-dev, meo-station-prod (umbrella); dev/prod-ingress-nginx, dev/prod-metrics-server.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-projects
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/minhtri1612/learning_RKE2.git
    targetRevision: main
    path: argocd/projects
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# argocd-clusters removed: path argocd/clusters không dùng; cluster credentials từ "argocd cluster add", không lưu Git.
