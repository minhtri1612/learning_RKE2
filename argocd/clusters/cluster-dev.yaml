# ⚠️  SECURITY: Cluster credentials KHÔNG ĐƯỢC commit vào Git.
# File này chỉ là TEMPLATE. Có 2 cách an toàn để apply:
#
# === Cách 1 (ĐƠN GIẢN NHẤT): argocd CLI ===
#   argocd cluster add <context-name> --name dev \
#     --kubeconfig ~/.kube/config \
#     --server https://10.1.101.115:6443 \
#     --grpc-web
#
# === Cách 2: Dùng Sealed Secrets ===
#   1. Tạo Secret bình thường với certData/keyData thật
#   2. kubeseal --cert pub-cert.pem -o yaml > cluster-dev-sealed.yaml
#   3. Commit cluster-dev-sealed.yaml (an toàn vì đã encrypt)
#
# === Cách 3: External Secrets Operator ===
#   Lưu certData/keyData trong AWS Secrets Manager, ESO tự sync
#
# Template (KHÔNG commit version này có credentials thật):
apiVersion: v1
kind: Secret
metadata:
  name: cluster-dev
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
  annotations:
    # Không để ArgoCD override phần credentials (config) được inject runtime.
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  name: dev
  # Server URL hiện tại của dev cluster (dùng cho doc + UI)
  server: https://10.1.101.166:6443
  # ⚠️ config được inject bằng script / argocd cluster add, KHÔNG khai báo trong Git.

