# ⚠️  SECURITY: Cluster credentials KHÔNG ĐƯỢC commit vào Git.
# File này chỉ là TEMPLATE. Có 2 cách an toàn để apply:
#
# === Cách 1 (ĐƠN GIẢN NHẤT): argocd CLI ===
#   argocd cluster add <context-name> --name prod \
#     --kubeconfig ~/.kube/config \
#     --server https://10.2.101.59:6443 \
#     --grpc-web
#
# === Cách 2: Dùng Sealed Secrets ===
#   1. Tạo Secret bình thường với certData/keyData thật
#   2. kubeseal --cert pub-cert.pem -o yaml > cluster-prod-sealed.yaml
#   3. Commit cluster-prod-sealed.yaml (an toàn vì đã encrypt)
#
# Template (KHÔNG commit version này có credentials thật):
apiVersion: v1
kind: Secret
metadata:
  name: cluster-prod
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
  annotations:
    # Không để ArgoCD override phần credentials (config) được inject runtime.
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  name: prod
  server: https://10.2.101.59:6443
  # ⚠️ config được inject bằng script / argocd cluster add, KHÔNG khai báo trong Git.

