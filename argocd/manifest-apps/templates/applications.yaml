{{- range $appName, $appConfig := .Values }}
  {{- /* Only process maps (service configs), ignore metadata params */ -}}
  {{- if and (ne $appName "appsByEnv") (typeIs "map[string]interface {}" $appConfig) }}
  {{- $profile := index $appConfig "profile" | default (eq $appName "database" | ternary "db" "be") }}
  {{- $namespace := index $appConfig "namespace" | default (eq $appName "database" | ternary "database" "meo-stationery") }}
  {{- $syncWave := index $appConfig "syncWave" | default (eq $appName "database" | ternary "0" "1") }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $.Values.env }}-{{ $.Values.name }}-{{ $appName }}-app
  namespace: argocd
  labels:
    project: {{ $.Values.name }}
    env: {{ $.Values.env }}
    component: {{ $appName }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ quote $syncWave }}
spec:
  project: {{ $.Values.project }}
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: main
    path: template
    helm:
      valueFiles:
        - ../app/{{ $profile }}.yaml
        - ../env/{{ $.Values.env }}.yaml
      parameters:
        - name: currentService
          value: {{ $appName }}
        - name: nameOverride
          value: {{ $appName }}
        - name: fullnameOverride
          value: {{ $appName }}
  destination:
    name: {{ $.Values.cluster }}
    namespace: {{ $namespace }}
  syncPolicy:
    {{- if eq (toString $.Values.automated) "true" }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    retry:
      limit: 3
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  {{- end }}
{{- end }}
