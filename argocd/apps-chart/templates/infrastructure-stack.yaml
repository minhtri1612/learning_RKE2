{{- if .Values.infrastructure.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.infrastructure.ingress.name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.infrastructure.project }}
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: {{ .Values.infrastructure.ingress.targetRevision }}
    helm:
      values: |
{{ .Values.infrastructure.ingress.helmValues | indent 8 }}
  destination:
    name: {{ .Values.infrastructure.destinationName }}
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.infrastructure.metrics.name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.infrastructure.project }}
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: {{ .Values.infrastructure.metrics.targetRevision }}
    helm:
      values: |
{{ .Values.infrastructure.metrics.helmValues | indent 8 }}
  destination:
    name: {{ .Values.infrastructure.destinationName }}
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.infrastructure.externalsecrets.name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.infrastructure.project }}
  source:
    repoURL: {{ .Values.infrastructure.externalsecrets.repoURL }}
    targetRevision: {{ .Values.infrastructure.externalsecrets.targetRevision }}
    path: external-secrets/applications
    helm:
      valueFiles: {{ .Values.infrastructure.externalsecrets.valueFiles | toJson }}
  destination:
    name: {{ .Values.infrastructure.destinationName }}
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
