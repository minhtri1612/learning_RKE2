# prod-meostation-stack
# Deploy: umbrella chart (backend + database)
# Version: PINNED TAG (prod must use tags, not branches)
#
# Naming: <env>-<project>-stack
#
# === VERSION MANAGEMENT ===
# - Promotion: dev OK → create tag v1.x.x → update this file
# - Rollback: change targetRevision to previous tag (e.g., v1.1.0 → v1.0.0)
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-meostation-stack
  namespace: argocd
  labels:
    env: prod
    category: business
  annotations:
    # Track version history for rollback reference
    app.kubernetes.io/version: "v1.2.3"
spec:
  project: prod
  
  source:
    repoURL: https://github.com/minhtri1612/learning_RKE2.git
    targetRevision: v1.2.3  # PINNED TAG - change for promotion/rollback
    path: k8s_helm/meo-station
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  
  destination:
    name: prod
    namespace: meo-stationery
  
  # PROD: No auto-sync, manual only for safety
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
