# ─── XƯƠNG SỐNG APP (base) ───
# DevOps định nghĩa namespace/syncWave/targetRevision.
# Ứng dụng sync từ rendered manifests tại .manifest/<env>/<app>.

apps:
  backend:
    name: backend
    namespace: meo-stationery
    targetRevision: main
    syncWave: "1"

  database:
    name: database
    namespace: database
    targetRevision: main
    syncWave: "0"
