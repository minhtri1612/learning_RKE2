# Cấu hình chung cho chart meostation-apps (Argo sinh Application).
# valueFile: đường dẫn tương đối từ thư mục template/ (path Argo source).

apps:
  backend:
    namespace: meo-stationery
    targetRevision: main
    syncWave: "1"
    valueFile: ../app/be.yaml

  database:
    namespace: database
    targetRevision: main
    syncWave: "0"
    valueFile: ../app/db.yaml
