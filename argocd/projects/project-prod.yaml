# ArgoCD AppProject for Production
# Restrict allowed resource kinds – blast radius giảm nếu ai đó deploy nhầm.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: Production environment applications

  sourceRepos:
    - 'https://github.com/minhtri1612/learning_RKE2.git'

  destinations:
    - namespace: 'meo-stationery'
      server: '*'
    - namespace: 'database'
      server: '*'
    - namespace: 'external-secrets'
      server: '*'
    - namespace: 'argocd'
      server: 'https://kubernetes.default.svc'

  # Prod: tạm thời mở rộng giống dev để app sync được
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: storage.k8s.io
      kind: StorageClass
    - group: argoproj.io
      kind: Application
    - group: external-secrets.io
      kind: ClusterSecretStore

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
