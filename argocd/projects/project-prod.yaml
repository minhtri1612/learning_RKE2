# ArgoCD AppProject for Production
# Restrict allowed resource kinds – blast radius giảm nếu ai đó deploy nhầm.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: Production environment applications

  sourceRepos:
    - 'https://github.com/minhtri1612/learning_RKE2.git'

  destinations:
    - namespace: 'meo-stationery'
      server: '*'
    - namespace: 'database'
      server: '*'
    - namespace: 'external-secrets'
      server: '*'
    - namespace: 'argocd'
      server: 'https://kubernetes.default.svc'

  # Prod: chỉ cho phép cluster-scoped Application (app-of-apps)
  clusterResourceWhitelist:
    - group: argoproj.io
      kind: Application

  # Chỉ allow namespace-scoped resources cần thiết
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: batch
      kind: Job
    - group: external-secrets.io
      kind: ExternalSecret
    - group: external-secrets.io
      kind: SecretStore
