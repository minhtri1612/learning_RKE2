# ArgoCD AppProject for Development
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev
  namespace: argocd
spec:
  description: Development environment applications
  
  sourceRepos:
    - 'https://github.com/minhtri1612/learning_RKE2.git'  
  destinations:
    - namespace: 'meo-stationery'
      server: '*'
    - namespace: 'database'
      server: '*'
    - namespace: 'external-secrets'
      server: '*'
  
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
