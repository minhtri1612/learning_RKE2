apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
spec:
  description: Infrastructure Project (Ingress, Cert-Manager, External Secrets, Monitoring)
  # Whitelist các Helm repo cụ thể thay vì wildcard '*'
  sourceRepos:
  - https://kubernetes.github.io/ingress-nginx
  - https://charts.jetstack.io
  - https://charts.external-secrets.io
  - https://kubernetes-sigs.github.io/metrics-server/
  - https://argoproj.github.io/argo-helm
  - https://github.com/minhtri1612/learning_RKE2.git
  destinations:
  - namespace: 'ingress-nginx'
    server: '*'
  - namespace: 'cert-manager'
    server: '*'
  - namespace: 'external-secrets'
    server: '*'
  - namespace: 'kube-system'
    server: '*'
  - namespace: 'monitoring'
    server: '*'
  - namespace: 'argocd'
    server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
  # Infrastructure cần deploy cluster-scoped CRDs
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  - group: ''
    kind: Namespace
  - group: storage.k8s.io
    kind: StorageClass
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
  # ESO cluster-scoped resources
  - group: external-secrets.io
    kind: ClusterSecretStore
  - group: external-secrets.io
    kind: ClusterExternalSecret
