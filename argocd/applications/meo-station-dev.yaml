# App-of-Apps dev: app này chỉ render Application CRD (meo-station-database-dev, meo-station-backend-dev).
# Root app sync argocd/applications → tạo Application này → sync ra 2 app con.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meo-station-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: dev
  source:
    repoURL: https://github.com/minhtri1612/learning_RKE2.git
    targetRevision: main
    path: k8s_helm/meo-station
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  # Output là Application CRD → phải apply vào namespace argocd (cùng cluster ArgoCD)
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
