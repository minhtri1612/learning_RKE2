{{- range $name, $app := .Values.apps }}
{{- if $app.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meo-station-{{ $name }}-{{ $.Values.env }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  project: {{ $app.project | default $.Values.defaults.project }}
  source:
    repoURL: {{ $app.repoURL | default $.Values.defaults.repoURL }}
    targetRevision: {{ $app.targetRevision | default $.Values.defaults.targetRevision }}
    path: {{ $app.path }}
    helm:
      valueFiles:
        - values.yaml
        - values-{{ $.Values.env }}.yaml
  destination:
    server: {{ $app.destination.server }}
    namespace: {{ $app.namespace }}
  syncPolicy:
{{ toYaml ( $app.syncPolicy | default $.Values.defaults.syncPolicy ) | indent 4 }}
  {{- if $app.ignoreDifferences }}
  ignoreDifferences:
{{ toYaml $app.ignoreDifferences | indent 2 }}
  {{- end }}
{{- end }}
{{- end }}
