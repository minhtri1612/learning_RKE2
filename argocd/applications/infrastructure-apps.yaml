# App of Apps: Infrastructure tier
# App này sync folder argocd/applications/infrastructure → tạo các app infra con:
#   - dev-ingress-nginx, prod-ingress-nginx
#   - dev-metrics-server, prod-metrics-server
#   - externalsecrets-dev, externalsecrets-prod
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/minhtri1612/learning_RKE2.git
    targetRevision: main
    path: argocd/applications/infrastructure
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
