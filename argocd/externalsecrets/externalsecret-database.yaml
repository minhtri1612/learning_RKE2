# ExternalSecret: sync database secrets từ AWS Secrets Manager → K8s Secret
# Secret này được dùng bởi database StatefulSet (postgres)
#
# AWS Secrets Manager path: /meo-stationery/{env}/database
# Format: JSON với các keys: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#
# Cách tạo trong AWS (prod):
#   aws secretsmanager create-secret \
#     --name /meo-stationery/prod/database \
#     --secret-string '{
#       "POSTGRES_USER": "meo_admin",
#       "POSTGRES_PASSWORD": "your-prod-db-password-here",
#       "POSTGRES_DB": "meo_stationery"
#     }'
#
# Cách tạo trong AWS (dev):
#   aws secretsmanager create-secret \
#     --name /meo-stationery/dev/database \
#     --secret-string '{
#       "POSTGRES_USER": "meo_admin",
#       "POSTGRES_PASSWORD": "your-dev-db-password-here",
#       "POSTGRES_DB": "meo_stationery"
#     }'
---
# PROD database secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meo-stationery-database-secrets
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "-3"   # database secret phải có trước backend secret (wave -2)
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: meo-stationery-database-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: POSTGRES_USER
    remoteRef:
      key: /meo-stationery/prod/database
      property: POSTGRES_USER
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: /meo-stationery/prod/database
      property: POSTGRES_PASSWORD
  - secretKey: POSTGRES_DB
    remoteRef:
      key: /meo-stationery/prod/database
      property: POSTGRES_DB
---
# DEV database secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meo-stationery-database-secrets-dev
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: meo-stationery-database-secrets-dev
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: POSTGRES_USER
    remoteRef:
      key: /meo-stationery/dev/database
      property: POSTGRES_USER
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: /meo-stationery/dev/database
      property: POSTGRES_PASSWORD
  - secretKey: POSTGRES_DB
    remoteRef:
      key: /meo-stationery/dev/database
      property: POSTGRES_DB
