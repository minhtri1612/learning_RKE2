# ExternalSecret: sync backend secrets từ AWS Secrets Manager → K8s Secret
# Secret này được reference trong values-prod.yaml: existingSecret.name: meo-stationery-backend-secrets
#
# AWS Secrets Manager path (prod): /meo-stationery/prod/app-credentials
# Format: JSON với các keys: POSTGRES_*, DATABASE_URL, NEXTAUTH_SECRET
#
# Cách tạo trong AWS:
#   aws secretsmanager create-secret \
#     --name /meo-stationery/prod/backend \
#     --secret-string '{
#       "DATABASE_URL": "postgresql://meo_admin:PASSWORD@postgres.database.svc.cluster.local:5432/meo_stationery?schema=public",
#       "NEXTAUTH_SECRET": "your-nextauth-secret-here"
#     }'
---
# PROD backend secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meo-stationery-backend-secrets
  namespace: meo-stationery
  annotations:
    argocd.argoproj.io/sync-wave: "-2"  # sync trước PreSync migration job
spec:
  refreshInterval: 1h   # ESO re-sync từ AWS mỗi 1 tiếng
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: meo-stationery-backend-secrets   # tên K8s Secret được tạo ra
    creationPolicy: Owner                  # ESO owns Secret → xóa ExternalSecret thì xóa Secret luôn
    deletionPolicy: Retain                 # nhưng khi xóa thì giữ lại Secret (an toàn hơn cho prod)
  data:
  - secretKey: DATABASE_URL        # key trong K8s Secret
    remoteRef:
      key: meo-stationery/prod/app-credentials   # path trong AWS Secrets Manager (KHÔNG có dấu / đầu)
      property: DATABASE_URL                     # field trong JSON
  - secretKey: NEXTAUTH_SECRET
    remoteRef:
      key: meo-stationery/prod/app-credentials
      property: NEXTAUTH_SECRET
---
# DEV backend secrets (AWS path khác → credentials dev riêng)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meo-stationery-backend-secrets
  namespace: meo-stationery
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # Chỉ apply file này lên dev cluster, không apply lên prod
    # (ArgoCD sẽ sync file đúng cluster dựa trên Application destination)
spec:
  refreshInterval: 30m   # dev refresh nhanh hơn để test
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: meo-stationery-backend-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: meo-stationery/dev/app-credentials-v2
      property: DATABASE_URL
  - secretKey: NEXTAUTH_SECRET
    remoteRef:
      key: meo-stationery/dev/app-credentials-v2
      property: NEXTAUTH_SECRET
