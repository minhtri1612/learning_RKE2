# ClusterSecretStore: kết nối ESO với AWS Secrets Manager
# Scope: cluster-wide → mọi namespace đều có thể dùng store này qua ExternalSecret
#
# Yêu cầu:
# - IRSA (IAM Roles for Service Accounts) hoặc access key cho ESO controller
# - IAM policy phải có: secretsmanager:GetSecretValue, secretsmanager:DescribeSecret
#
# Cấu trúc secret trong AWS Secrets Manager:
#   /meo-stationery/prod/backend  → { DATABASE_URL, NEXTAUTH_SECRET }
#   /meo-stationery/prod/database → { POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB }
#   /meo-stationery/dev/backend   → { DATABASE_URL, NEXTAUTH_SECRET }
#   /meo-stationery/dev/database  → { POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB }
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1   # đổi theo region AWS của bạn
      auth:
        # Dùng access key lưu trong Secret (phù hợp lab trên RKE2/EC2, không có IRSA như EKS)
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: secret-access-key
