# Config theo môi trường: prod
env: prod
project: prod
clusterName: prod
valueFileSuffix: prod
# targetRevision phải là tag release đã qua QA, KHÔNG bám main.
targetRevision: v1.2.3
autoSync: false  # prod = MANUAL sync (deploy qua UI/CLI sau review)
# Image Updater bị disable cho prod:
# Prod image được kiểm soát bởi targetRevision ở trên (tag cố định).
# Để update prod image: sửa targetRevision → tạo PR → merge → manual sync từ ArgoCD UI.
imageUpdaterEnabled: "false"

