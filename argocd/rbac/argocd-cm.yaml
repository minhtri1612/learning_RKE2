# ArgoCD ConfigMap
# Cấu hình chung cho ArgoCD (SSO, webhooks, etc.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  # Application instance label key (for tracking)
  application.instanceLabelKey: argocd.argoproj.io/instance
  
  # Timeout for application sync
  timeout.reconciliation: 180s
  
  # Local user accounts (apiKey/login capabilities)
  accounts.dev-user: apiKey, login
  accounts.prod-user: apiKey, login
  
  # SSO Configuration (Optional - uncomment and configure if needed)
  # dex.config: |
  #   connectors:
  #   - type: oidc
  #     id: google
  #     name: Google
  #     config:
  #       issuer: https://accounts.google.com
  #       clientID: $GOOGLE_CLIENT_ID
  #       clientSecret: $GOOGLE_CLIENT_SECRET
  #       redirectURI: https://argocd.local/api/dex/callback
  
  # Git repository credentials (if needed for private repos)
  # repositories: |
  #   - url: https://github.com/minhtri1612/learning_RKE2.git
  #   - url: https://github.com/minhtri1612/practice_RKE2.git
  
  # Global ignoreDifferences for all resources
  # Ignore fields that are managed by K8s controllers (HPA, StatefulSet controller, etc.)
  resource.customizations.ignoreDifferences.apps_Deployment: |
    jsonPointers:
    - /spec/replicas
  
  resource.customizations.ignoreDifferences.apps_StatefulSet: |
    jsonPointers:
    - /spec/volumeClaimTemplates
    - /spec/serviceName
