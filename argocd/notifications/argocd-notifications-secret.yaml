# ArgoCD Notifications Secret
# Chứa credentials cho notification services (Slack token, etc.)
# File này là TEMPLATE — credentials thật phải được inject qua ESO hoặc sealed-secret.
#
# Cách đúng:
# 1. Lưu Slack token trong AWS Secrets Manager: /argocd/notifications/slack-token
# 2. ESO tự sync vào Secret này (xem argocd/externalsecrets/argocd-notifications-es.yaml)
#
# KHÔNG commit plaintext token vào đây.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
  annotations:
    # ESO sẽ manage secret này — ArgoCD không nên override
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  # Điền khi không dùng ESO (dev/local only)
  slack-token: ""   # xhoxp-...
