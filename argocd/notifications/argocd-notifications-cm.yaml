apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # Slack service configuration
  service.slack: |
    token: $slack-token

  # Default triggers for all applications
  defaultTriggers: |
    - on-deployed
    - on-health-degraded
    - on-sync-failed

  # Default subscriptions - send to #new-channel for all apps
  subscriptions: |
    - recipients:
        - slack:new-channel
      triggers:
        - on-deployed
        - on-health-degraded
        - on-sync-failed

  # Triggers - when to send notifications
  trigger.on-deployed: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [app-deployed]
  
  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]
  
  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]
  
  trigger.on-sync-running: |
    - when: app.status.operationState.phase in ['Running']
      send: [app-sync-running]
  
  # Templates - message format
  template.app-deployed: |
    message: |
      ✅ Application {{.app.metadata.name}} successfully deployed
      Environment: {{.app.spec.destination.server}}
      Revision: {{.app.status.sync.revision}}
    slack:
      attachments: |
        [{
          "title": "{{ .app.metadata.name}}",
          "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
          "color": "good",
          "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Health Status",
              "value": "{{.app.status.health.status}}",
              "short": true
            },
            {
              "title": "Revision",
              "value": "{{.app.status.sync.revision}}",
              "short": true
            },
            {
              "title": "Environment",
              "value": "{{.app.spec.destination.server}}",
              "short": true
            }
          ]
        }]
  
  template.app-health-degraded: |
    message: |
      ⚠️ Application {{.app.metadata.name}} health is DEGRADED
    slack:
      attachments: |
        [{
          "title": "{{ .app.metadata.name}}",
          "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
          "color": "warning",
          "fields": [
            {
              "title": "Health Status",
              "value": "{{.app.status.health.status}}",
              "short": true
            },
            {
              "title": "Environment",
              "value": "{{.app.spec.destination.server}}",
              "short": true
            }
          ]
        }]
  
  template.app-sync-failed: |
    message: |
      ❌ Application {{.app.metadata.name}} sync FAILED
    slack:
      attachments: |
        [{
          "title": "{{ .app.metadata.name}}",
          "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
          "color": "danger",
          "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Error",
              "value": "{{.app.status.operationState.message}}",
              "short": false
            }
          ]
        }]
  
  template.app-sync-running: |
    message: |
      🔄 Application {{.app.metadata.name}} sync is running...
    slack:
      attachments: |
        [{
          "title": "{{ .app.metadata.name}}",
          "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
          "color": "#0DADEA",
          "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.operationState.phase}}",
              "short": true
            }
          ]
        }]
